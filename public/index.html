  // ---------- deal edit / new modal ----------

  function textField(key, label, value, opts) {
    opts = opts || {};
    var input;
    if (opts.textarea) {
      input = '<textarea name="' + key + '" autocomplete="off">' + esc(value) + '</textarea>';
    } else if (opts.type === 'date') {
      input = '<input type="date" name="' + key + '" autocomplete="off" value="' + esc(sheetDateToISO(value)) + '" />';
    } else if (opts.selectOptions) {
      // A real <select> — unlike a text input with a <datalist>, every
      // option is visible on a single click, no typing needed to surface
      // them. Used where clarity matters more than being able to type a
      // value outside the sheet's own dropdown list.
      var current = String(value || '');
      // A blank/not-yet-set value gets its own placeholder option rather
      // than silently landing on whichever real option happens to be
      // first in the list — a <select> with nothing marked `selected`
      // shows (and submits) its first option by default, which would
      // otherwise quietly set a real value nobody chose.
      var optionsHtml = (!current ? '<option value="" selected>—</option>' : '') +
        (current && opts.selectOptions.indexOf(current) === -1 ? [current] : [])
          .concat(opts.selectOptions)
          .map(function (o) { return '<option value="' + esc(o) + '"' + (o === current ? ' selected' : '') + '>' + esc(o) + '</option>'; })
          .join('');
      input = '<select name="' + key + '">' + optionsHtml + '</select>';
    } else if (opts.datalistOptions) {
      var listId = 'dl-' + key.replace(/[^a-z0-9]/gi, '');
      input = '<input type="text" name="' + key + '" list="' + listId + '" autocomplete="off" value="' + esc(value) + '" />' +
        '<datalist id="' + listId + '">' + opts.datalistOptions.map(function (o) { return '<option value="' + esc(o) + '">'; }).join('') + '</datalist>';
    } else {
      input = '<input type="' + (opts.type || 'text') + '" name="' + key + '" autocomplete="off" value="' + esc(value) + '"' +
        (opts.min !== undefined ? ' min="' + esc(opts.min) + '"' : '') + ' />';
    }
    return '<div class="field' + (opts.full ? ' full' : '') + '"><label>' + esc(label) + '</label>' + input + '</div>';
  }

  // Star rating field — Google Sheets stores star ratings as integers 0–5.
  function starField(key, label, value) {
    var current = Math.max(0, Math.min(5, parseInt(String(value || '')) || 0));
    var stars = [1, 2, 3, 4, 5].map(function (i) {
      return '<span class="star' + (i <= current ? ' on' : '') + '" data-val="' + i + '">★</span>';
    }).join('');
    return '<div class="field full"><label>' + esc(label) + '</label>' +
      '<div class="star-field" data-star-key="' + esc(key) + '">' + stars + '</div>' +
      '<input type="hidden" name="' + esc(key) + '" value="' + current + '" /></div>';
  }

  // Multi-select field — sheet stores comma-separated values.
  function multiCheckField(key, label, value, options) {
    var selected = String(value || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var checks = options.map(function (opt) {
      return '<label><input type="checkbox" data-multi-key="' + esc(key) + '" value="' + esc(opt) + '"' +
        (selected.indexOf(opt) !== -1 ? ' checked' : '') + '> ' + esc(opt) + '</label>';
    }).join('');
    return '<div class="field full"><label>' + esc(label) + '</label>' +
      '<div class="multi-check-grid">' + checks + '</div>' +
      '<input type="hidden" name="' + esc(key) + '" value="' + esc(selected.join(',')) + '" /></div>';
  }

  // Read-only star display for tables (no input, no interaction).
  function displayStars(value) {
    var n = Math.max(0, Math.min(5, parseInt(String(value || '')) || 0));
    if (!n) return '<span style="color:var(--faint)">—</span>';
    return [1,2,3,4,5].map(function(i){
      return '<span style="font-size:16px;line-height:1;color:' + (i<=n?'#FCDE5C':'var(--line)') + '">★</span>';
    }).join('');
  }

  // Read-only pill list for tables.
  function displayPills(value) {
    var parts = String(value || '').split(',').map(function(s){return s.trim();}).filter(Boolean);
    if (!parts.length) return '<span style="color:var(--faint)">—</span>';
    return parts.map(function(p){
      return '<span style="display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark);margin:1px 2px 1px 0;white-space:nowrap">' + esc(p) + '</span>';
    }).join('');
  }

  // Wire star-rating clicks and multi-check → hidden-input sync after any modal
  // sets its innerHTML. Must be called once per modal open.
  function initModalInteractivity(root) {
    root.querySelectorAll('.star-field').forEach(function (sf) {
      var key = sf.getAttribute('data-star-key');
      var hidden = root.querySelector('input[type="hidden"][name="' + key + '"]');
      var stars = sf.querySelectorAll('.star');
      function applyVal(val) {
        stars.forEach(function (s, i) { s.classList.toggle('on', i < val); });
        if (hidden) hidden.value = val;
      }
      stars.forEach(function (s) {
        s.addEventListener('click', function () { applyVal(parseInt(s.getAttribute('data-val'))); });
        s.addEventListener('mouseenter', function () {
          stars.forEach(function (s2, i) { s2.classList.toggle('on', i < parseInt(s.getAttribute('data-val'))); });
        });
      });
      sf.addEventListener('mouseleave', function () { applyVal(hidden ? parseInt(hidden.value) || 0 : 0); });
    });
    root.querySelectorAll('[data-multi-key]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var key = cb.getAttribute('data-multi-key');
        var hidden = root.querySelector('input[type="hidden"][name="' + key + '"]');
        if (!hidden) return;
        hidden.value = Array.from(root.querySelectorAll('[data-multi-key="' + key + '"]:checked'))
          .map(function (el) { return el.value; }).join(',');
      });
    });
  }

  // Per-field config shared by the New Deal wizard (buildField below) — the
  // existing flat edit form in openDealModal keeps its own inline field
  // list untouched, since this only needs to cover the New Deal case.
  var DEAL_FIELD_DEFS = {
    'Month': { label: 'Month', datalist: true },
    'Institution Name': { label: 'Institution Name', full: true },
    'City': { label: 'City' },
    'Institution Type': { label: 'Institution Type', datalist: true },
    'Student Strength': { label: 'Student Strength' },
    'Priority': { label: 'Priority', datalist: true },
    'Sales Stage': { label: 'Sales Stage', datalist: true },
    'Expected Deal Value (₹)': { label: 'Expected Deal Value (₹)', type: 'number', min: 0 },
    'Expected Closure': { label: 'Expected Closure', datalist: true },
    'Probability (%)': { label: 'Probability (%)', datalist: true },
    'Demo Status': { label: 'Demo Status', datalist: true },
    'Proposal Status': { label: 'Proposal Status', datalist: true },
    'Price Discussion': { label: 'Price Discussion', datalist: true },
    'Next Follow-up Date': { label: 'Next Follow-up Date', type: 'date' },
    'Last Interaction Date': { label: 'Last Interaction Date', type: 'date' },
    'First Contact Date': { label: 'First Contact Date (lead entry date)', type: 'date' },
    'Decision Maker': { label: 'Decision Maker' },
    'Designation': { label: 'Designation' },
    'Mobile No': { label: 'Decision Maker Mobile No.' },
    'Email': { label: 'Decision Maker Email' },
    '2nd Level Contact Person': { label: '2nd Level Contact Person' },
    'Designation (2)': { label: 'Designation (2nd contact)' },
    'Mobile No.': { label: '2nd Contact Mobile No.' },
    'Email (2)': { label: '2nd Contact Email' },
    'Current ERP': { label: 'Current ERP', datalist: true },
    'Lead Source': { label: 'Lead Source', datalist: true },
    'Implementation Readiness': { label: 'Implementation Readiness', datalist: true },
    'Remarks': { label: 'Remarks', textarea: true, full: true },
    'ERP Satisfaction Score': { label: 'ERP Satisfaction Score', star: true },
    'Product': { label: 'Products', multicheck: true },
    'Pain Points': { label: 'Pain Points', textarea: true, full: true },
    'Module Using': { label: 'Module Using', datalist: true }
  };

  function buildField(key, value) {
    var def = DEAL_FIELD_DEFS[key];
    if (!def) return '';
    if (def.star) return starField(key, def.label, value);
    if (def.multicheck) return multiCheckField(key, def.label, value, distinctValues(key));
    var opts = def.datalist ? choiceFieldOpts(key) : {};
    if (def.textarea) opts.textarea = true;
    if (def.type) opts.type = def.type;
    if (def.min !== undefined) opts.min = def.min;
    if (def.full) opts.full = true;
    return textField(key, def.label, value, opts);
  }

  // ---------- new deal wizard ----------
  // The ~25-field form is a lot to scroll through for a brand-new row where
  // every field starts blank — grouped into a few short steps instead,
  // navigated with Back/Next and a slide transition (one <form> the whole
  // time, so FormData on submit picks up every step's fields regardless of
  // which one is currently in view — nothing is lost switching steps).
  var WIZARD_STEPS = [
    { title: 'Institution', desc: 'Basic details about the school or college', fields: ['Month', 'Institution Name', 'City', 'Institution Type', 'Student Strength', 'Priority'] },
    { title: 'Pipeline', desc: 'Deal value, stage and expected close date', fields: ['Sales Stage', 'Expected Deal Value (₹)', 'Expected Closure', 'Probability (%)', 'Next Follow-up Date'] },
    { title: 'Progress', desc: 'Demo, proposal and interaction tracking', fields: ['Demo Status', 'Proposal Status', 'Price Discussion', 'Implementation Readiness', 'Last Interaction Date', 'First Contact Date'] },
    { title: 'Contacts & Notes', desc: 'People to reach and additional context', fields: ['Decision Maker', 'Designation', 'Mobile No', 'Email', '2nd Level Contact Person', 'Designation (2)', 'Mobile No.', 'Email (2)', 'Current ERP', 'Lead Source', 'Remarks'] },
    { title: 'ERP & Discovery', desc: 'ERP feedback, pain points and product interest', fields: ['ERP Satisfaction Score', 'Product', 'Pain Points', 'Module Using'] }
  ];

  function openNewDealWizard() {
    var has = fieldsPresent();
    function has1(f) { return has.indexOf(f) !== -1; }
    var steps = WIZARD_STEPS.map(function (step) {
      return { title: step.title, fields: step.fields.filter(has1) };
    }).filter(function (step) { return step.fields.length > 0; });

    if (steps.length === 0) { openDealModal(null); return; }

    var stepsHtml = steps.map(function (step) {
      // First Contact Date defaults to today — a brand-new lead's contact
      // date is overwhelmingly "just now", so pre-filling it saves the
      // common case a click while still being editable for backdated entry.
      var fieldsHtml = step.fields.map(function (key) {
        return buildField(key, key === 'First Contact Date' ? todaySheetDate() : '');
      }).join('');
      return '<div class="wizard-step"><div class="form-grid">' + fieldsHtml + '</div></div>';
    }).join('');

    var segsHtml = steps.map(function (s, i) { return '<span class="wizard-progress-seg" data-seg="' + i + '"></span>'; }).join('');

    var html =
      '<div class="modal-backdrop" id="wizardModal"><div class="modal wizard-modal">' +
        '<div class="wizard-head">' +
          '<div class="wizard-head-row">' +
            '<div class="wizard-head-text">' +
              '<p class="wiz-eyebrow" id="wizardEyebrow"></p>' +
              '<h2 id="wizardTitle"></h2>' +
              '<p class="wiz-desc" id="wizardDesc"></p>' +
            '</div>' +
            '<button type="button" class="wizard-close" id="wizardClose" aria-label="Close">✕</button>' +
          '</div>' +
          '<div class="wizard-progress" id="wizardProgress">' + segsHtml + '</div>' +
        '</div>' +
        '<form id="wizardForm">' +
          '<div class="wizard-viewport"><div class="wizard-track" id="wizardTrack">' + stepsHtml + '</div></div>' +
          '<div class="modal-actions">' +
            '<button type="button" class="ghost" id="wizardBack" style="display:none">← Back</button>' +
            '<div class="spacer"></div>' +
            '<button type="button" class="ghost" id="wizardCancel">Cancel</button>' +
            '<button type="button" class="pill" id="wizardNext">Next →</button>' +
            '<button type="submit" class="pill" id="wizardSubmit" style="display:none">Add lead</button>' +
          '</div>' +
        '</form>' +
      '</div></div>';

    document.getElementById('modalRoot').innerHTML = html;
    initModalInteractivity(document.getElementById('modalRoot'));

    var current = 0;
    var track = document.getElementById('wizardTrack');
    var titleEl = document.getElementById('wizardTitle');
    var eyebrowEl = document.getElementById('wizardEyebrow');
    var descEl = document.getElementById('wizardDesc');
    var backBtn = document.getElementById('wizardBack');
    var nextBtn = document.getElementById('wizardNext');
    var submitBtn = document.getElementById('wizardSubmit');
    var segs = document.querySelectorAll('.wizard-progress-seg');

    function goTo(i) {
      current = Math.max(0, Math.min(steps.length - 1, i));
      track.style.transform = 'translateX(-' + (current * 100) + '%)';
      eyebrowEl.textContent = 'Step ' + (current + 1) + ' of ' + steps.length;
      titleEl.textContent = steps[current].title;
      descEl.textContent = WIZARD_STEPS.find(function (s) { return s.title === steps[current].title; }).desc || '';
      backBtn.style.display = current === 0 ? 'none' : '';
      var isLast = current === steps.length - 1;
      nextBtn.style.display = isLast ? 'none' : '';
      submitBtn.style.display = isLast ? '' : 'none';
      segs.forEach(function (s, si) {
        s.classList.toggle('active', si === current);
        s.classList.toggle('done', si < current);
      });
    }

    document.getElementById('wizardCancel').addEventListener('click', closeModal);
    document.getElementById('wizardClose').addEventListener('click', closeModal);
    document.getElementById('wizardModal').addEventListener('click', function (e) { if (e.target.id === 'wizardModal') closeModal(); });
    backBtn.addEventListener('click', function () { goTo(current - 1); });
    nextBtn.addEventListener('click', function () { goTo(current + 1); });
    segs.forEach(function (s, si) { s.addEventListener('click', function () { goTo(si); }); });

    // Enter in a text input advances to the next step instead of trying to
    // submit early (a hidden submit button can still fire on Enter in some
    // browsers) — textareas keep Enter as a plain newline.
    document.getElementById('wizardForm').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && document.activeElement.tagName !== 'TEXTAREA' && current < steps.length - 1) {
        e.preventDefault();
        goTo(current + 1);
      }
    });

    document.getElementById('wizardForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var data = new FormData(e.target);
      var out = {};
      data.forEach(function (v, k) { out[k] = v; });
      withSubmitLoading(e.target, 'Adding…', function (restore) {
        saveRow(null, out, closeModal, restore);
      });
    });

    goTo(0);
  }

  function openDealModal(row) {

    function has1(f) { return has.indexOf(f) !== -1; }

    // Build field HTML per tab — all panels stay in the DOM so FormData
    // picks up every field regardless of which tab is active.
    var p0 = ''; // Institution
    if (has1('Month')) p0 += textField('Month', 'Month', r.Month, choiceFieldOpts('Month'));
    if (has1('Institution Name')) p0 += textField('Institution Name', 'Institution Name', r['Institution Name'], { full: !isNew });
    if (has1('City')) p0 += textField('City', 'City', r.City);

    if (has1('Lead Source')) p3 += textField('Lead Source', 'Lead Source', r['Lead Source'], choiceFieldOpts('Lead Source'));
    if (has1('Remarks')) p3 += textField('Remarks', 'Remarks', r.Remarks, { textarea: true, full: true });

    var p4 = ''; // ERP & Discovery

    // Only render tabs/panels that have at least one field

            dupWarning.style.display = 'none';

    // Inject Deal Lost reason panel inside the Pipeline tab panel
    var lostReasonHtml =
      '<div id="lostReasonPanel" style="display:none;margin-top:14px;padding:14px 16px;background:rgba(130,29,19,.06);border:1px solid rgba(130,29,19,.18);border-radius:12px">' +
        '<p style="margin:0 0 10px;font-size:12px;font-weight:700;color:var(--deep);text-transform:uppercase;letter-spacing:.07em">Why was this deal lost?</p>' +
        '<select id="lostReasonSelect" style="width:100%;margin-bottom:10px">' +
          '<option value="">— Select a reason —</option>' +

    // Inject after the form-grid that contains Sales Stage (Pipeline tab)

    document.getElementById('dealForm').addEventListener('submit', function (e) {

      var data = new FormData(e.target);
      var out = {};
      data.forEach(function (v, k) { out[k] = v; });
      // Multi-check fields: read checked state directly from the DOM at submit
      // time rather than relying on the hidden-input sync (which depends on
      // change events and can be skipped when the panel is display:none).
      var multiGroups = {};
      e.target.querySelectorAll('[data-multi-key]').forEach(function (cb) {
        var key = cb.getAttribute('data-multi-key');
        if (!multiGroups[key]) multiGroups[key] = [];
        if (cb.checked) multiGroups[key].push(cb.value);
      });
      Object.keys(multiGroups).forEach(function (key) { out[key] = multiGroups[key].join(','); });

      // If saving as Deal Lost, require a reason and prepend it to Remarks
      if (out['Sales Stage'] === 'Deal Lost') {
        var reasonEl = document.getElementById('lostReasonSelect');
        var noteEl = document.getElementById('lostReasonNote');
        var reason = reasonEl ? reasonEl.value.trim() : '';
        if (!reason) {
          if (reasonEl) { reasonEl.style.outline = '2px solid var(--deep)'; reasonEl.focus(); }
          showBanner('Please select a reason for losing this deal.', 'error');
          return;
        }
        var note = noteEl ? noteEl.value.trim() : '';
        var tag = '[Deal Lost · ' + reason + ']' + (note ? ' ' + note : '');
        var existing = (out['Remarks'] || '').trim();
        out['Remarks'] = tag + (existing ? '\n' + existing : '');
      }

      withSubmitLoading(e.target, 'Saving…', function (restore) {
        saveRow(isNew ? null : r._row, out, closeModal, restore);
      });
    });
    var deleteBtn = document.getElementById('dealDelete');
    if (deleteBtn) {
      deleteBtn.addEventListener('click', function () {
        // Hard delete — actually removes the row from the sheet, not
        // reversible from here — a plain confirm() is a deliberately
        // blocking, unmissable prompt for something this destructive.
        if (!window.confirm('Delete "' + (r['Institution Name'] || 'this lead') + '"? This removes it from the sheet and cannot be undone from here.')) return;
        deleteBtn.disabled = true;
        deleteBtn.textContent = 'Deleting…';
        deleteLead(r._row, closeModal, function () { deleteBtn.disabled = false; deleteBtn.textContent = 'Delete'; });
      });
    }
    if (!isNew) mountVisitsSection(document.getElementById('visitsSection'), r['Institution Name'] || '');
  }

  function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

  function friendlyBridgeError(msg) {
    if (/unreachable|non-JSON|timed out/i.test(msg)) return 'Google Sheets was temporarily unreachable. Please try again.';
    return msg;
  }

  function showToast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;pointer-events:none;opacity:1;transition:opacity .4s ease';
    document.body.appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 400); }, 2400);
  }

  // ---------- visits (per-institution visit log: date + km + notes) ----------
  // Stored in a separate "Visits" tab on the manager's own sheet — kept off
  // the main pipeline columns so it doesn't clutter them — auto-created by
  // apps-script/Code.gs the first time anything asks for it (see api/visits.js).

  function mountVisitsSection(container, institutionName) {
    if (!container) return;
    container.innerHTML =
      '<h3 style="margin:0 0 12px;font-size:14px;font-weight:700;color:var(--brand)">Visits</h3>' +
      '<div id="visitsList"></div>' +
      '<form id="visitAddForm"><div class="form-grid" style="margin-top:14px">' +
        textField('Visit Date', 'Visit Date', todaySheetDate(), { type: 'date' }) +
        textField('Distance (km)', 'Distance (km)', '', { type: 'number', min: 0 }) +
        textField('Mode of Travel', 'Mode of Travel', '', { datalistOptions: VISIT_MODE_OPTIONS }) +
        textField('CNG KM', 'CNG KM', '', { type: 'number', min: 0 }) +
        textField('CNG Amount (₹)', 'CNG Amount (₹)', '', { type: 'number', min: 0 }) +
        textField('Petrol KM', 'Petrol KM', '', { type: 'number', min: 0 }) +
        textField('Petrol Amount (₹)', 'Petrol Amount (₹)', '', { type: 'number', min: 0 }) +
        textField('Transport Cost (₹)', 'Transport Cost (₹)', '', { type: 'number', min: 0 }) +
        textField('Dining Cost (₹)', 'Dining Cost (₹)', '', { type: 'number', min: 0 }) +
        textField('Hotel Cost (₹)', 'Hotel Cost (₹)', '', { type: 'number', min: 0 }) +
        textField('Notes', 'Notes', '', { full: true }) +
        '<div class="full" style="text-align:right"><button type="submit" class="pill small">Log visit</button></div>' +
      '</div></form>';

    // Renders from state.visits (the same data the Leads table's Visits
    // column and the dedicated Visits page read) rather than its own
    // separate fetch, so all three stay consistent — refreshVisits()
    // after a mutation updates state.visits once, this just re-paints.
    function renderList() {
      var listEl = document.getElementById('visitsList');
      if (!listEl) return;
      var visits = visitsFor(institutionName);
      if (visits.length === 0) {
        listEl.className = 'empty';
        listEl.textContent = 'No visits logged yet.';
        return;
      }
      var totalKm = visits.reduce(function (s, v) { return s + num(v['Distance (km)']); }, 0);
      var totalExpense = visits.reduce(function (s, v) { return s + visitExpenseTotal(v); }, 0);
      listEl.className = '';
      listEl.innerHTML = '<div style="font-size:13px;color:var(--faint);margin-bottom:10px">' +
        visits.length + ' visit' + (visits.length === 1 ? '' : 's') + ' &middot; ' + totalKm.toLocaleString('en-IN') + ' km' +
        (totalExpense ? ' &middot; ' + money(totalExpense) + ' spent' : '') + '</div>' +
        visits.map(function (v) {
          var expense = visitExpenseTotal(v);
          return '<div class="followup-item">' +
            '<div class="meta">' +
              '<div class="name">' + esc(v['Visit Date'] || '—') + (v['Distance (km)'] ? ' · ' + esc(v['Distance (km)']) + ' km' : '') +
                (v['Mode of Travel'] ? ' · ' + esc(v['Mode of Travel']) : '') + (expense ? ' · ' + money(expense) : '') + '</div>' +
              '<div class="sub">' +
                (v['CNG KM'] ? 'CNG: ' + esc(v['CNG KM']) + ' km' + (v['CNG Amount (₹)'] ? ' / ' + money(num(v['CNG Amount (₹)'])) : '') : '') +
                (v['CNG KM'] && v['Petrol KM'] ? ' · ' : '') +
                (v['Petrol KM'] ? 'Petrol: ' + esc(v['Petrol KM']) + ' km' + (v['Petrol Amount (₹)'] ? ' / ' + money(num(v['Petrol Amount (₹)'])) : '') : '') +
              '</div>' +
              (v.Notes ? '<div class="sub">' + esc(v.Notes) + '</div>' : '') +
            '</div>' +
            '<div class="row-actions"><button type="button" class="ghost small" data-del-visit="' + v._row + '">Delete</button></div>' +
          '</div>';
        }).join('');
      listEl.querySelectorAll('[data-del-visit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!window.confirm('Delete this visit record?')) return;
          btn.disabled = true;
          authedFetch('/api/visits', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ _row: Number(btn.getAttribute('data-del-visit')) }),
          }).then(function (r2) { return r2.json(); })
            .then(function () { refreshVisits(function () { renderList(); }); })
            .catch(function () { btn.disabled = false; });
        });
      });
    }

    document.getElementById('visitAddForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var data = new FormData(e.target);
      var out = {};
      data.forEach(function (v, k) { out[k] = v; });
      out['Institution Name'] = institutionName;
      if (out['Visit Date']) out['Visit Date'] = isoToSheetDate(out['Visit Date']);
      clampNonNegative(out, ['Distance (km)', 'CNG KM', 'Petrol KM'].concat(VISIT_COST_FIELDS));
      withSubmitLoading(e.target, 'Logging…', function (restore) {
        authedFetch('/api/visits', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: out }),
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            restore();
            if (!res.ok) { showBanner('Could not log visit: ' + (res.d.error || 'unknown error'), 'error'); return; }
            e.target.reset();
            refreshVisits(function () { renderList(); });
          }).catch(function (err) { restore(); showBanner('Could not log visit: ' + err, 'error'); });
      });
    });

    renderList();
  }

  function whoami(basic) {
    return fetch('/api/whoami', { headers: { Authorization: 'Basic ' + basic } })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, status: r.status, data: data }; }); });
  }

  function attemptLogin(basic) {
    return whoami(basic).then(function (res) {
      if (!res.ok) {
        var err = new Error((res.data && res.data.error) || 'Sign-in failed');
        err.status = res.status;
        throw err;
      }
      me = { name: res.data.name || '', isManager: !!res.data.isManager, isHead: !!res.data.isHead };
      writeSession(basic, me);
      showApp();
    });
  }

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var user = document.getElementById('loginUser').value.trim();
    var pass = document.getElementById('loginPass').value;
    var basic = btoa(user + ':' + pass);
    var btn = document.getElementById('loginSubmit');
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span>Signing in…';
    attemptLogin(basic).catch(function (err) {
      showAuthGate(err.message);
    }).then(function () {
      btn.disabled = false;
      btn.innerHTML = 'Sign in';
    });
  });

  // On refresh/restart: if we have a cached me object, show the app
  // immediately (no "Signing in…" flash) and re-verify in the background.
  // Only a real 401 (wrong credentials) clears the session and forces re-login.
  // Network/bridge hiccups on the verify call are silently ignored — the
  // server re-checks credentials on every API call anyway, so if creds are
  // invalid they'll get a 401 on the first data load.
  function bootFromSession(session) {
    var basic = session.basic;
    var cachedMe = session.me;
    if (cachedMe) {
      me = cachedMe;
      showApp();
      // Background re-verify — only to refresh me data or force 401 logout.
      whoami(basic).then(function (res) {
        if (!res.ok) {
          if (res.status === 401) { clearSession(); location.reload(); }
          // non-401 network error: stay logged in, stale me is fine
          return;
        }
        me = { name: res.data.name || '', isManager: !!res.data.isManager, isHead: !!res.data.isHead };
        writeSession(basic, me);
      }).catch(function () { /* bridge unreachable — stay logged in */ });
    } else {
      // Older session entry without cached me — verify the old way
      showAuthGate('Signing in…');
      attemptLogin(basic).catch(function (err) {
        if (err.status === 401) {
          clearSession();
          showAuthGate();
        } else {
          showAuthGate((err.message || 'Could not verify your session') + ' — try again.', function () {
            bootFromSession(session);
          });
        }
      });
    }
  }

  var existing = readSession();
  if (existing && existing.basic) {
    bootFromSession(existing);
  } else {
    showAuthGate();
  }
})();
</script>
</body>
</html>
