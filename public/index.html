<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OD Sales CRM</title>
<link rel="icon" type="image/png" href="logo.png" />
<style>
/* Design language matched to the sibling kpi project (Okie Dokie CS Team KPI
   dashboard): palette sampled from the logo — orange #EC6724, wordmark
   maroon #821D13, star gold #FCDE5C — Apple system font stack, soft layered
   card shadows, pill buttons, Apple-style segmented tab control. */
:root {
  --ink: #1D1D1F;
  --body: #6E6E73;
  --faint: #86868B;
  --page: #F5F5F7;
  --card: #FFFFFF;
  --line: #D2D2D7;
  --hair: rgba(0,0,0,0.07);
  --brand: #EC6724;
  --brand-dark: #C4501A;
  --brand-soft: #FDF0E8;
  --deep: #821D13;
  --ok: #2E7D32;
  --ok-soft: #E9F5EA;
  --warn: #B8860B;
  --warn-soft: #FBF3DE;
  --bad: #A82A1C;
  --bad-soft: #FBEDEB;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .kpi-group {
    background: linear-gradient(135deg, #2A1A0E 0%, #221408 50%, #2A1A0E 100%);
    border-color: rgba(236,103,36,.22);
  }
  :root:not([data-theme="light"]) {
    --ink: #F2F2F5;
    --body: #A9A9B2;
    --faint: #8B8B93;
    --page: #111113;
    --card: #1C1C1F;
    --line: #313135;
    --hair: rgba(255,255,255,0.08);
    --brand: #EC6724;
    --brand-dark: #FF8A4C;
    --brand-soft: #3A2417;
    --deep: #E8998E;
    --ok: #5FB86B;
    --ok-soft: #16281A;
    --warn: #D9A83B;
    --warn-soft: #2E2510;
    --bad: #E8695B;
    --bad-soft: #331715;
  }
}
:root[data-theme="dark"] {
  --ink: #F2F2F5; --body: #A9A9B2; --faint: #8B8B93; --page: #111113; --card: #1C1C1F;
  --line: #313135; --hair: rgba(255,255,255,0.08); --brand: #EC6724; --brand-dark: #FF8A4C;
  --brand-soft: #3A2417; --deep: #E8998E; --ok: #5FB86B; --ok-soft: #16281A;
  --warn: #D9A83B; --warn-soft: #2E2510; --bad: #E8695B; --bad-soft: #331715;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
    "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 15px; line-height: 1.47; letter-spacing: -.011em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
:focus-visible { outline: 3px solid rgba(236,103,36,.5); outline-offset: 2px; border-radius: 6px; }

.masthead {
  position: sticky; top: 0; z-index: 20;
  background: var(--card); border-bottom: 1px solid var(--hair);
}
.masthead .inner {
  max-width: 1280px; margin: 0 auto; padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
}
.masthead img { width: 32px; height: 32px; display: block; flex-shrink: 0; }
.masthead .name { font-size: 16px; font-weight: 700; letter-spacing: -.015em; color: var(--ink); line-height: 1.2; }
.masthead .name span { display: block; color: var(--faint); font-weight: 400; font-size: 11px; margin-top: 1px; }
.spacer { flex: 1; }

/* Apple-style segmented control for the primary tabs */
.presets { display: inline-flex; background: var(--page); border-radius: 11px; padding: 2px; }
.presets button {
  font: inherit; font-size: 14px; font-weight: 500; letter-spacing: -.01em;
  border: 0; background: none; color: var(--body); padding: 7px 16px; border-radius: 9px;
  cursor: pointer; transition: background .2s ease, color .2s ease, box-shadow .2s ease;
}
.presets button:hover { color: var(--ink); }
.presets button[aria-pressed="true"] {
  background: var(--card); color: var(--ink); font-weight: 600;
  box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 0 0 .5px rgba(0,0,0,.04);
}

button.pill {
  font: inherit; font-size: 14px; font-weight: 600; letter-spacing: -.01em;
  border: 0; border-radius: 980px; padding: 9px 18px; cursor: pointer;
  background: var(--brand); color: #fff; transition: background .2s ease, transform .1s ease;
}
button.pill:hover { background: var(--brand-dark); }
button.pill:active { transform: scale(.97); }
button.pill:disabled { opacity: .75; cursor: not-allowed; transform: none; }
@keyframes btn-spin { to { transform: rotate(360deg); } }
.btn-spinner {
  display: inline-block; width: 13px; height: 13px; margin-right: 7px;
  border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
  border-radius: 50%; animation: btn-spin .65s linear infinite;
  vertical-align: middle; flex-shrink: 0;
}
button.ghost {
  font: inherit; font-size: 14px; font-weight: 600; letter-spacing: -.01em;
  border: 0; border-radius: 980px; padding: 9px 18px; cursor: pointer;
  background: var(--page); color: var(--ink);
}
button.ghost:hover { background: var(--hair); }
button.small { padding: 6px 13px; font-size: 13px; border-radius: 8px; }
button[disabled] { opacity: .4; pointer-events: none; }

main { padding: 24px 24px 60px; max-width: 1280px; margin: 0 auto; }

/* Page masthead + divider — the Overview tab's own opening, styled exactly
   like the follow-up digest email's masthead (api/followup-digest.js):
   centered eyebrow, bold headline, gray date line, hairline rule after. */
.page-masthead { text-align: center; margin-bottom: 24px; }
.page-masthead .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--brand-dark); margin: 0 0 10px; }
.page-masthead h1 { font-size: 23px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); margin: 0 0 6px; }
.page-masthead .date { font-size: 14px; color: var(--body); margin: 0; }
.divider { border: none; border-top: 1px solid var(--hair); margin: 24px 0; }

.banner { padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-bottom: 18px; }
.banner.error { background: var(--bad-soft); color: var(--bad); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.warn { background: #fff7ed; color: #c2410c; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
select, input[type=text], input[type=number], input[type=search], input[type=password], textarea {
  background: var(--page); color: var(--ink);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 11px; font-size: 13px; font-family: inherit;
}
input:focus, select:focus, textarea:focus { border-color: var(--brand); }

/* KPI tiles, matched to kpi's .kpi/.fig/.lab shape */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
/* On desktop widths, force every KPI tile onto one row instead of
   wrapping — auto-fit alone wraps once there isn't room for another
   160px column, which orphaned the 8th tile onto its own row. */
@media (min-width: 860px) {
  .kpis { grid-template-columns: repeat(8, 1fr); }
  .kpi { padding: 16px 14px 14px; }
  .kpi .fig { font-size: 24px; }
}
/* Flat bordered cards, not shadow/elevation — matches the follow-up digest
   email's .email-container (api/followup-digest.js: white card, 1px hairline
   border, 12px radius, no shadow) rather than the "floating app panel" look
   shadows read as. Modals keep their shadow — those really are an
   overlay floating above the page, which the email has no equivalent of. */
.kpi {
  background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 20px 20px 18px;
  text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
}
.kpi .fig { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .lab { font-size: 13px; font-weight: 600; letter-spacing: -.005em; color: var(--faint); margin-top: 10px; text-transform: uppercase; letter-spacing: .03em; font-size: 11px; }
.kpi-icon {
  width: 34px; height: 34px; border-radius: 10px; background: var(--brand-soft);
  display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
  margin-left: auto; margin-right: auto;
}
.kpi-icon svg { width: 18px; height: 18px; color: var(--brand); }

/* Grouped KPI card — reference-site style: one white card, KPI cells in a row separated by internal dividers */
.kpi-group {
  background: linear-gradient(135deg, #FDF0E8 0%, #FFF8F4 50%, #FDF0E8 100%);
  border: 1px solid rgba(236,103,36,.18); border-radius: 20px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  margin-bottom: 16px; overflow: hidden;
}
.kpi-group-head {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 24px 12px;
  position: relative;
}
.kgi-badge { position: absolute; right: 20px; }
.kgi-title { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand-dark); }
.kgi-badge {
  font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 20px;
  background: var(--brand-soft); color: var(--brand-dark);
}
.kpi-cells { display: flex; overflow-x: auto; border-top: 1px solid var(--hair); }
.kpi-cell {
  flex: 1; min-width: 110px; padding: 14px 20px 18px;
  border-right: 1px solid var(--hair);
}
.kpi-cell:last-child { border-right: none; }
.kpi-cell { display: flex; flex-direction: column; }
.kci-label {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 8px; min-height: 26px;
}
.kci-icon { width: 14px; height: 14px; flex-shrink: 0; display: flex; align-items: center; opacity: .8; }
.kci-icon svg { display: block; }
.kci-fig { font-size: 20px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: auto; }

/* Overview page header row */
.ov-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; gap: 12px; }
.ov-header-left .ov-eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--brand-dark); margin: 0 0 4px; }
.ov-header-left h2 { margin: 0 0 3px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.ov-header-left .ov-date { font-size: 13px; color: var(--faint); margin: 0; }
.ov-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.bars.scroll { overflow-x: auto; justify-content: flex-start; }
.bars.scroll .bar-col { flex: 0 0 72px; }
@media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
.card {
  background: var(--card); border: 1px solid var(--hair); border-radius: 20px; padding: 24px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
}
/* section-eyebrow / section-headline, straight out of the digest email's
   sectionHead() — centered uppercase colored label + a centered gray
   sentence underneath, instead of a plain left-aligned bold label. */
.card h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; text-align: center; color: var(--brand); }
.card .subtitle { margin: 4px 0 20px; font-size: 13px; font-weight: 500; color: var(--faint); text-align: center; }
.bars { display: flex; align-items: flex-end; gap: 10px; padding-top: 30px; position: relative; }
.bars::before {
  content: ''; position: absolute; inset: 30px 0 40px 0;
  background: repeating-linear-gradient(to top, var(--hair) 0, var(--hair) 1px, transparent 1px, transparent 25%);
  pointer-events: none; border-radius: 4px;
}
.bar-col { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; z-index: 1; }
/* A fixed-height track for the bar, separate from the label below it — the
   bar's height:X% needs a denominator that's ONLY the bar's own space. When
   .bar and .bar-label shared one flex column, a near-100% bar's height
   collided with the label's space and flexbox silently shrank both by
   different, bar-specific amounts — the tallest bar in a chart ended up a
   few px shorter than the rest, which is what "bars going up and down"
   actually was (every bar under ~30% never triggered it, so it looked
   patternless). Fixed track + fixed-height label below means every column
   is the same total height regardless of that bar's own percentage. */
.bar-track { height: 160px; width: 100%; display: flex; align-items: flex-end; justify-content: center; overflow: visible; }
.bar {
  width: 100%; max-width: 48px; border-radius: 8px 8px 3px 3px;
  background: var(--brand); position: relative;
  transition: filter .15s ease, transform .15s ease;
}
.bar:hover { filter: brightness(1.1); transform: scaleY(1.02); transform-origin: bottom; }
.bar .val {
  position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  width: max-content; white-space: nowrap; text-align: center;
  font-size: 12px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums;
  background: var(--card); padding: 1px 5px; border-radius: 4px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
/* Fixed height (not auto) — a 1-line label ("Deals Won") and a 2-line one
   ("Demo Completed") must take up the same space so every column's total
   height matches regardless of how many lines its own label wraps to. */
.bar-label { font-size: 11px; font-weight: 500; color: var(--body); margin-top: 10px; text-align: center; line-height: 1.3; height: 30px; overflow: hidden; }

table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border: 1px solid var(--hair); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04); }
thead th { text-align: left; background: var(--page); color: var(--faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; padding: 11px 14px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--ink); }
thead th.sortable.active { color: var(--brand); }
thead th.num { text-align: right; }
.sort-icon { display: inline-block; margin-left: 5px; font-size: 10px; opacity: .4; }
.sort-icon.active { opacity: 1; color: var(--brand); font-weight: 700; }
thead th.sortable:hover .sort-icon { opacity: .8; }
tbody td { padding: 11px 14px; border-bottom: 1px solid var(--hair); vertical-align: middle; font-size: 13px; }
tbody td.lead-name { font-weight: 700; color: var(--ink); max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--brand-soft); cursor: pointer; }

.pill-tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.pill-tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.pill-tag.stage-new       { background: #EEF2FF; color: #4338CA; }
.pill-tag.stage-cold      { background: #F1F5F9; color: #475569; }
.pill-tag.stage-followup  { background: #FFF7ED; color: #C2410C; }
.pill-tag.stage-demo      { background: #F0FDF4; color: #15803D; }
.pill-tag.stage-proposal  { background: #ECFDF5; color: #059669; }
.pill-tag.stage-tech      { background: #F5F3FF; color: #7C3AED; }
.pill-tag.stage-nego      { background: #FFF3E0; color: #E65100; }
.pill-tag.stage-won       { background: var(--ok-soft); color: var(--ok); }
.pill-tag.stage-lost      { background: var(--bad-soft); color: var(--bad); }
.pill-tag.stage-campus    { background: #E0F2FE; color: #0369A1; }
.pill-tag.stage-support   { background: #F8FAFC; color: #64748B; }
.pill-tag.default         { background: var(--hair); color: var(--body); }

.priority-dot { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
.priority-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.overdue { color: var(--bad); font-weight: 700; }
.due-today { color: var(--warn); font-weight: 700; }
.empty { padding: 48px; text-align: center; color: var(--faint); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(20,16,14,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 100; }
.modal { background: var(--card); border-radius: 18px; width: 100%; max-width: 640px; padding: 26px; box-shadow: 0 24px 64px rgba(0,0,0,.26), 0 2px 8px rgba(0,0,0,.08); }
.modal h2 { margin: 0 0 18px; font-size: 18px; font-weight: 700; letter-spacing: -.015em; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.field label { display: block; font-size: 12px; color: var(--faint); font-weight: 600; margin-bottom: 5px; }
.field select, .field input, .field textarea { width: 100%; }
.field textarea { min-height: 70px; resize: vertical; }
.star-field { display: inline-flex; gap: 6px; padding: 6px 2px; cursor: pointer; }
.star-field .star { font-size: 26px; color: var(--line); transition: color .1s, transform .1s; line-height: 1; user-select: none; }
.star-field .star.on { color: #FCDE5C; text-shadow: 0 0 6px rgba(252,222,92,.4); }
.star-field .star:hover { transform: scale(1.15); }
.multi-check-grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); min-height: 42px; }
.multi-check-grid label { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; cursor: pointer; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--page); transition: background .12s, border-color .12s; }
.multi-check-grid label:has(input:checked) { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-dark); font-weight: 700; }
.multi-check-grid input[type="checkbox"] { accent-color: var(--brand); width: 13px; height: 13px; }
.modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.modal-actions .spacer { flex: 1; }
.row-actions { display: flex; gap: 6px; }

/* New Deal wizard — one form, several steps that slide horizontally. */
.wizard-modal { max-width: 620px; overflow: hidden; }
.wizard-head { margin-bottom: 20px; }
.wizard-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.wizard-head-text { flex: 1; min-width: 0; }
.wiz-eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--brand); margin: 0 0 5px; }
.wizard-head h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.wiz-desc { font-size: 13px; color: var(--faint); margin: 0; }
.wizard-close { padding: 4px 8px; font-size: 20px; line-height: 1; color: var(--faint); flex-shrink: 0; background: none; border: none; cursor: pointer; border-radius: 8px; transition: background .15s, color .15s; }
.wizard-close:hover { background: var(--hair); color: var(--ink); }
.wizard-progress { display: flex; gap: 5px; }
.wizard-progress-seg { flex: 1; height: 3px; border-radius: 2px; background: var(--line); transition: background .25s ease; }
.wizard-progress-seg.done { background: var(--brand); opacity: .45; }
.wizard-progress-seg.active { background: var(--brand); opacity: 1; }
.wizard-viewport { overflow: hidden; }
.wizard-track { display: flex; transition: transform .32s cubic-bezier(.4,0,.2,1); }
.wizard-step { flex: 0 0 100%; min-width: 0; padding: 2px 0; }

.followup-item { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04); }
.followup-item .meta { flex: 1; min-width: 0; }
.followup-item .name { font-weight: 700; font-size: 14px; letter-spacing: -.01em; }
.followup-item .sub { font-size: 12px; color: var(--faint); margin-top: 3px; }

.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.auth-card { background: var(--card); border: 1px solid var(--hair); border-radius: 20px; padding: 34px 28px 28px; text-align: center; max-width: 360px; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06); }
.auth-card img { width: 64px; height: 64px; margin-bottom: 18px; }
.auth-card h1 { font-size: 20px; margin: 0 0 8px; font-weight: 700; letter-spacing: -.02em; }
.auth-card p { font-size: 14px; color: var(--body); margin: 0 0 22px; line-height: 1.5; }
.auth-card button.pill { width: 100%; padding: 11px 22px; }
.auth-card .hint { margin-top: 16px; font-size: 13px; color: var(--faint); }

.who-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 8px 24px; max-width: 1280px; margin: 0 auto; }
.who-row .who { font-size: 13px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: min(240px, 40vw); }
.who-row button.ghost { padding: 6px 13px; font-size: 13px; }

.master-tenant { margin-bottom: 28px; }
.master-tenant h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 14px; }
.master-tenant .tenant-error { color: var(--bad); font-size: 13px; }

/* Visits page — one vertical timeline per client, so a client with
   several visits reads as a single continuous history instead of being
   scattered through a flat list interleaved with every other client's.
   Each client is its own bordered card (matching .card elsewhere); each
   visit inside it is a compact row hung off a connecting line, same
   visual language as a changelog/activity feed. */
.visit-client {
  background: var(--card); border: 1px solid var(--hair); border-radius: 12px;
  padding: 18px 20px; margin-bottom: 16px;
}
.visit-client h4 { font-size: 15px; font-weight: 700; margin: 0 0 3px; letter-spacing: -.01em; }
.visit-client .client-stats { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
.visit-timeline { position: relative; margin-top: 14px; }
.visit-timeline-item { position: relative; padding: 10px 0 10px 22px; border-top: 1px solid var(--hair); }
.visit-timeline-item:first-child { border-top: none; padding-top: 4px; }
.visit-timeline-item:last-child { padding-bottom: 0; }
.visit-timeline-item::before {
  content: ''; position: absolute; left: 2px; top: 17px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--brand);
}
.visit-timeline-item:first-child::before { top: 11px; }
.visit-timeline-item .vt-date { font-weight: 700; font-size: 13px; }
.visit-timeline-item .vt-meta { font-size: 12px; color: var(--faint); margin-top: 3px; }
.visit-timeline-item .vt-notes { font-size: 12px; font-style: italic; margin-top: 4px; color: var(--body); }
.visit-lead-link { cursor: pointer; color: var(--ink); border-bottom: 1.5px dashed var(--line); transition: color .15s, border-color .15s; }
.visit-lead-link:hover { color: var(--brand); border-color: var(--brand); }

/* Lead edit modal — tabbed layout */
.deal-edit-modal { max-width: 660px; }
.modal-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--hair); margin: 0 -26px 18px; padding: 0 20px; overflow-x: auto; scrollbar-width: none; }
.modal-tabs::-webkit-scrollbar { display: none; }
.modal-tab { background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--faint); padding: 8px 14px; margin-bottom: -1px; white-space: nowrap; transition: color .15s, border-color .15s; border-radius: 0; }
.modal-tab:hover { color: var(--ink); }
.modal-tab.active { color: var(--brand); border-bottom-color: var(--brand); }
.modal-tab-panel { display: none; }
.modal-tab-panel.active { display: block; }
</style>
</head>
<body>
<div id="authGate" class="auth-wrap">
  <div class="auth-card">
    <img src="logo.png" alt="Okie Dokie" />
    <h1>OD Sales CRM</h1>
    <p>Sign in to view your sales pipeline.</p>
    <form id="loginForm">
      <div class="field" style="text-align:left;margin-bottom:10px;">
        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" name="username" autocomplete="username" required />
      </div>
      <div class="field" style="text-align:left;margin-bottom:16px;">
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="pill" id="loginSubmit">Sign in</button>
    </form>
    <div class="hint" id="authHint"></div>
    <button type="button" class="ghost" id="authRetryBtn" style="display:none;margin-top:12px;width:100%">Retry</button>
  </div>
</div>

<div id="app" style="display:none">
<header class="masthead">
  <div class="inner">
    <img src="logo.png" alt="Okie Dokie" />
    <div class="name">OD Sales CRM<span>Institution sales pipeline</span></div>
    <div class="spacer"></div>
    <nav class="presets" id="nav">
      <button data-tab="overview" aria-pressed="true">Overview</button>
      <button data-tab="deals" aria-pressed="false">Leads</button>
      <button data-tab="followups" aria-pressed="false">Follow-ups</button>
      <button data-tab="visits" aria-pressed="false">Visits</button>
      <button data-tab="master" aria-pressed="false" id="masterTabBtn" style="display:none">Master</button>
    </nav>
    <button class="pill" id="newDealBtn">+ New lead</button>
  </div>
</header>
<div class="who-row" id="whoRow" style="display:none">
  <span class="who" id="whoText"></span>
  <button class="ghost" id="logoutBtn">Sign out</button>
</div>

<main>
  <div id="banner"></div>
  <div id="tab-overview"></div>
  <div id="tab-deals" style="display:none"></div>
  <div id="tab-followups" style="display:none"></div>
  <div id="tab-visits" style="display:none"></div>
  <div id="tab-master" style="display:none"></div>
</main>
</div><!-- #app -->

<div id="modalRoot"></div>

<script>
(function () {
  'use strict';

  var state = { headers: [], rows: [], dropdowns: {}, visits: [], loading: true, error: null, tab: 'overview', month: 'All' };
  var me = { name: '', isManager: false, isHead: false };

  var CORE_FIELDS = ['Month', 'Institution Name', 'City', 'Institution Type', 'Student Strength', 'Priority',
    'Sales Stage', 'Expected Deal Value (₹)', 'Expected Closure', 'Decision Maker', 'Designation', 'Mobile No', 'Email',
    '2nd Level Contact Person', 'Designation (2)', 'Mobile No.', 'Email (2)', 'Current ERP', 'ERP Satisfaction',
    'Lead Source', 'First Contact Date', 'Last Interaction Date', 'Next Follow-up Date', 'Demo Status',
    'Proposal Status', 'Price Discussion', 'Probability (%)', 'Implementation Readiness', 'Remarks',
    'ERP Satisfaction Score', 'Product', 'Pain Points', 'Module Using'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fieldsPresent() {
    // Use whichever of CORE_FIELDS actually exist in this sheet's headers,
    // so a renamed/removed column degrades gracefully instead of crashing.
    return CORE_FIELDS.filter(function (f) { return state.headers.indexOf(f) !== -1; });
  }

  // The sheet's own Data Validation dropdown (if that column has one) is
  // authoritative and includes every option even if no existing row has
  // used it yet — falls back to whatever's actually been typed into rows
  // so far for a free-text column with no validation (e.g. Current ERP).
  var STATIC_OPTIONS = {
    'Product': ['ERP', 'CRM', 'HRM', 'Job Portal', 'Alumni', 'Website'],
  };

  function distinctValues(field) {
    // Static overrides for fields whose options are defined in code rather than
    // the sheet's Data Validation (e.g. Product, which stores comma-separated
    // text and therefore has no useful dropdown in the sheet).
    if (STATIC_OPTIONS[field]) return STATIC_OPTIONS[field].slice();
    // The sheet's own dropdown list has a real intended order (e.g. Sales
    // Stage runs New Lead -> ... -> Deal Won, a pipeline progression, not
    // an alphabet) — preserve it exactly rather than sorting. Only the
    // fallback (whatever's already been typed into rows, with no
    // inherent order of its own) gets alphabetized, purely so it's easy
    // to scan.
    if (state.dropdowns && state.dropdowns[field] && state.dropdowns[field].length) {
      return state.dropdowns[field].slice();
    }
    var seen = {};
    state.rows.forEach(function (r) {
      var v = (r[field] || '').toString().trim();
      if (v) seen[v] = true;
    });
    return Object.keys(seen).sort();
  }

  // For a field the sheet actually locks to a real Data Validation
  // dropdown, render a proper <select> — every option is visible in one
  // click, and it can't drift from what the sheet allows. For a field with
  // no validation (open text, e.g. Current ERP — any product name is
  // valid), fall back to a text input with a datalist of whatever's
  // already been typed, since forcing a closed list there would block
  // entering a genuinely new value the sheet was never told to expect.
  function choiceFieldOpts(field) {
    if (state.dropdowns && state.dropdowns[field] && state.dropdowns[field].length) {
      return { selectOptions: distinctValues(field) };
    }
    return { datalistOptions: distinctValues(field) };
  }

  function num(v) {
    var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''));
    return isNaN(n) ? 0 : n;
  }

  function money(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  // Indian short scale (same convention as the sibling kpi project): crore
  // above 1,00,00,000, lakh above 1,00,000, plain below. Used anywhere space
  // is tight (KPI tiles, chart bar labels) — "₹24,55,000" doesn't wrap (no
  // spaces) and overflows a narrow box; "₹24.55L" reliably fits.
  function inr(n) {
    return '₹' + (
      n >= 1e7 ? (n / 1e7).toFixed(2).replace(/\.00$/, '') + 'Cr'
      : n >= 1e5 ? (n / 1e5).toFixed(1).replace(/\.0$/, '') + 'L'
      : Math.round(n).toLocaleString('en-IN'));
  }

  // Sheet dates: "5/8/2026" (D/M/YYYY) or free text like "July 26". Returns a
  // Date or null — never throws, since sheet data is hand-entered and messy.
  function parseSheetDate(raw) {
    if (!raw) return null;
    var s = String(raw).trim();
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if (m) {
      var y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
      return new Date(Date.UTC(y, Number(m[2]) - 1, Number(m[1])));
    }
    var d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }

  function todayUTC() {
    var n = new Date();
    return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
  }

  // Sheet dates are entered/displayed as "D/M/YYYY" (see Code.gs); an
  // <input type=date> needs "YYYY-MM-DD" instead — these two convert
  // between the two so the calendar picker can be dropped onto a date
  // field without changing what actually gets written to the sheet.
  var DATE_FIELDS = ['Next Follow-up Date', 'Last Interaction Date', 'First Contact Date'];

  // A number input's min="0" only hints the browser's own spinner/
  // validation UI — typing "-" followed by digits still isn't reliably
  // blocked everywhere, so a negative Expected Deal Value could still
  // reach the sheet. This clamps it to 0 right before it's sent, leaving
  // a genuinely blank value (not yet estimated) untouched.
  function clampNonNegative(fields, keys) {
    keys.forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(fields, k) && fields[k] !== '' && num(fields[k]) < 0) {
        fields[k] = 0;
      }
    });
  }

  // Not sheet-driven (this is a new column, no Data Validation to read
  // from yet) — a fixed list covers the common cases; the field still
  // accepts free text via its own datalist fallback for anything else.
  var VISIT_MODE_OPTIONS = ['Own Vehicle', 'Public Transport', 'Cab', 'Train', 'Flight', 'Walk'];
  var VISIT_COST_FIELDS = ['CNG Amount (₹)', 'Petrol Amount (₹)', 'Transport Cost (₹)', 'Dining Cost (₹)', 'Hotel Cost (₹)'];

  function visitExpenseTotal(v) {
    return VISIT_COST_FIELDS.reduce(function (s, k) { return s + num(v[k]); }, 0);
  }

  function sheetDateToISO(raw) {
    var d = parseSheetDate(raw);
    if (!d) return '';
    var y = d.getUTCFullYear(), m = d.getUTCMonth() + 1, day = d.getUTCDate();
    return y + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }

  function fmtSheetDate(raw) {
    var d = parseSheetDate(raw);
    if (!d) return raw || '—';
    var day = d.getUTCDate(), m = d.getUTCMonth() + 1, y = d.getUTCFullYear();
    return (day < 10 ? '0' : '') + day + '/' + (m < 10 ? '0' : '') + m + '/' + y;
  }

  function isoToSheetDate(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return iso || '';
    return Number(m[3]) + '/' + Number(m[2]) + '/' + Number(m[1]);
  }

  function todaySheetDate() {
    var n = new Date();
    return n.getDate() + '/' + (n.getMonth() + 1) + '/' + n.getFullYear();
  }

  // ---------- data loading ----------

  function showBanner(msg, kind) {
    var el = document.getElementById('banner');
    if (!msg) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="banner ' + (kind || 'error') + '">' + esc(msg) + '</div>';
  }

  // ---------- session (plain username/password, HTTP Basic Auth) ----------
  // Kept in localStorage so it survives browser restarts and tab closes.
  // The server re-validates credentials on every API call (lib/auth.js),
  // so a stale token is rejected immediately — localStorage just removes
  // the need to retype the password every session. Sign-out clears it.
  // Wrapped in try/catch since storage can throw (private browsing, blocked cookies).

  var SESSION_KEY = 'salescrm.session';

  function readSession() {
    try {
      var raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function writeSession(basic, meObj) {
    try { localStorage.setItem(SESSION_KEY, JSON.stringify({ basic: basic, me: meObj || null })); } catch (e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }

  // Attaches the logged-in session (if any) as HTTP Basic Auth — the server
  // re-checks it against the Credentials tab on every call (lib/auth.js)
  // rather than trusting anything else about the request, so this is just
  // carrying proof of who is asking, not an authorization decision made
  // client-side.
  function authedFetch(url, options) {
    options = options || {};
    var session = readSession();
    var headers = {};
    for (var k in (options.headers || {})) headers[k] = options.headers[k];
    if (session && session.basic) headers.Authorization = 'Basic ' + session.basic;
    var merged = {};
    for (var k2 in options) merged[k2] = options[k2];
    merged.headers = headers;
    return fetch(url, merged);
  }

  function load() {
    state.loading = true;
    render();
    Promise.all([
      authedFetch('/api/sheet').then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); }),
      // Visits is a separately-deployed addition — a manager whose Apps
      // Script bridge hasn't been redeployed with the updated Code.gs yet
      // gets an error here; caught locally so it just leaves the visits
      // list empty instead of failing the whole page load.
      authedFetch('/api/visits').then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
        .catch(function () { return { ok: false, data: {} }; }),
    ]).then(function (results) {
      var sheetRes = results[0], visitsRes = results[1];
      state.loading = false;
      if (!sheetRes.ok) {
        state.error = sheetRes.data && sheetRes.data.error ? sheetRes.data.error : 'Failed to load sheet';
        showBanner('Could not load data from the sheet: ' + state.error +
          '. Check your registry row has a working Sheet Bridge URL/Token — see SETUP.md.', 'error');
        render();
        return;
      }
      state.error = null;
      state.headers = sheetRes.data.headers || [];
      state.rows = sheetRes.data.rows || [];
      state.dropdowns = sheetRes.data.dropdowns || {};
      state.visits = (visitsRes.ok && visitsRes.data.rows) ? visitsRes.data.rows : [];
      showBanner('');
      render();
    }).catch(function (err) {
      state.loading = false;
      state.error = String(err);
      showBanner('Network error loading data: ' + err, 'error');
      render();
    });
  }

  // Every visit logged for one institution (case-insensitive match, since
  // Institution Name is hand-typed on both sides), most recent first.
  function visitsFor(institutionName) {
    var needle = String(institutionName || '').trim().toLowerCase();
    if (!needle) return [];
    return state.visits.filter(function (v) {
      return (v['Institution Name'] || '').trim().toLowerCase() === needle;
    }).sort(function (a, b) {
      var ad = parseSheetDate(a['Visit Date']), bd = parseSheetDate(b['Visit Date']);
      return (bd ? bd.getTime() : 0) - (ad ? ad.getTime() : 0);
    });
  }

  // Re-fetches just the visits list into state.visits (not a full load(),
  // which would also re-hit /api/sheet) — used after logging/deleting a
  // visit so the Leads table's Visits column and the Visits page stay in
  // sync with whatever was just changed from the lead edit modal.
  function refreshVisits(onDone) {
    authedFetch('/api/visits').then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (res.ok && res.d.rows) state.visits = res.d.rows;
        onDone && onDone(res.ok ? null : (res.d.error || 'unknown error'));
      }).catch(function (err) { onDone && onDone(String(err)); });
  }

  // onError, when given, is called only on failure — success closes the
  // modal (via onDone) so there's no button left to restore.
  function saveRow(rowNumber, fields, onDone, onError, _attempt) {
    // Form fields for DATE_FIELDS come out of a <input type=date> as ISO
    // ("2026-09-22") — convert back to the sheet's own "D/M/YYYY" text
    // convention before it's written, so the cell (and every other bit of
    // code that reads it back, e.g. parseSheetDate) sees the same format
    // regardless of whether the row was ever edited through the picker.
    DATE_FIELDS.forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(fields, k)) fields[k] = isoToSheetDate(fields[k]);
    });
    clampNonNegative(fields, ['Expected Deal Value (₹)']);
    var attempt = _attempt || 1;
    authedFetch('/api/sheet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(rowNumber ? { _row: rowNumber, fields: fields } : { fields: fields }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) {
          // Auto-retry once more on bridge errors before giving up (server
          // already retried 5× internally; one client retry doubles the
          // total attempts without the user needing to do anything).
          if (attempt < 2 && /unreachable|non-JSON|timed out/i.test(res.d.error || '')) {
            showBanner('Google Sheets was slow — retrying…', 'warn');
            setTimeout(function () { saveRow(rowNumber, fields, onDone, onError, 2); }, 2000);
            return;
          }
          showBanner('Save failed — ' + friendlyBridgeError(res.d.error || 'unknown error'), 'error');
          onError && onError();
          return;
        }
        showBanner(rowNumber ? 'Lead updated.' : 'Lead added.', 'ok');
        onDone && onDone();
        load();
      }).catch(function (err) {
        if (attempt < 2) {
          showBanner('Google Sheets was slow — retrying…', 'warn');
          setTimeout(function () { saveRow(rowNumber, fields, onDone, onError, 2); }, 2000);
          return;
        }
        showBanner('Save failed — ' + friendlyBridgeError(String(err)), 'error');
        onError && onError();
      });
  }

  function deleteLead(rowNumber, onDone, onError) {
    authedFetch('/api/sheet', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ _row: rowNumber }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { showBanner('Delete failed: ' + (res.d.error || 'unknown error'), 'error'); onError && onError(); return; }
        showBanner('Lead deleted.', 'ok');
        onDone && onDone();
        load();
      }).catch(function (err) { showBanner('Delete failed: ' + err, 'error'); onError && onError(); });
  }

  function sendEmailReq(payload, onDone, onError) {
    authedFetch('/api/email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { showBanner('Email failed to send: ' + (res.d.error || 'unknown error'), 'error'); onError && onError(); return; }
        showBanner('Email sent to ' + payload.to + '.', 'ok');
        onDone && onDone();
        load();
      }).catch(function (err) { showBanner('Email failed to send: ' + err, 'error'); onError && onError(); });
  }

  // Disables a submit button and swaps its label while the async action
  // runs, restoring both if it fails (a slow bridge round-trip otherwise
  // looks like the click did nothing) — success doesn't need a restore
  // since the modal that owns the button closes.
  function withSubmitLoading(form, loadingText, run) {
    var btn = form.querySelector('button[type="submit"]');
    if (!btn) { run(function () {}); return; }
    var original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span>' + loadingText;
    run(function () { btn.disabled = false; btn.innerHTML = original; });
  }

  // ---------- overview ----------

  // Union of both "Month" (A) and "Expected Closure" (I) — they're
  // different fields and don't always have the same set of month labels
  // (e.g. a sheet with October only ever written in the Expected Closure
  // column, never in Month). Without this, a month that only exists in
  // Expected Closure could never be selected here at all, even though
  // computeKpis() reads Expected Closure by this same selected value.
  // Month's own order comes first (its sheet order), then any
  // Expected-Closure-only labels appended in Expected Closure's own
  // order — never re-sorted, so neither column's intended chronological
  // ordering gets scrambled.
  function monthOptions() {
    var seen = {};
    var merged = [];
    distinctValues('Month').concat(distinctValues('Expected Closure')).forEach(function (m) {
      if (m && !seen[m]) { seen[m] = true; merged.push(m); }
    });
    return merged;
  }

  function overviewRows() {
    if (state.month === 'All') return state.rows;
    return state.rows.filter(function (r) { return r.Month === state.month; });
  }

  // opts.monthFilter/opts.allRows are only meaningful for the Overview
  // page (which has a Month selector) — the Master tab's calls omit them
  // and get the old whole-tenant-total behavior.
  // Shared by computeKpis (the aggregate figure) and renderOverview (the
  // "which leads" breakdown list under it) so the two can never disagree
  // about which rows actually count.
  function expectedClosureRows(allRows, monthFilter) {
    return allRows.filter(function (r) {
      if (monthFilter && monthFilter !== 'All' && r['Expected Closure'] !== monthFilter) return false;
      return r.Priority === 'Topmost' && r['Sales Stage'] !== 'Deal Lost' && r['Sales Stage'] !== 'Deal Won';
    });
  }

  function computeKpis(rows, opts) {
    opts = opts || {};
    var monthFilter = opts.monthFilter || 'All';
    var allRows = opts.allRows || rows;

    var totalLeads = rows.length;
    var highPriority = rows.filter(function (r) { return r.Priority === 'Topmost'; }).length;
    var demoCompleted = rows.filter(function (r) { return r['Demo Status'] === 'Completed'; }).length;
    var proposalShared = rows.filter(function (r) {
      var v = r['Proposal Status'];
      return v && v !== 'Not Shared';
    }).length;
    var underPriceDiscussion = rows.filter(function (r) {
      var v = r['Price Discussion'];
      return v && v !== 'Not Started' && v !== 'Price Finalized';
    }).length;
    var dealsWon = rows.filter(function (r) { return r['Sales Stage'] === 'Deal Won'; }).length;
    var pipelineValue = rows.reduce(function (s, r) { return s + num(r['Expected Deal Value (₹)']); }, 0);
    // Expected Closure is keyed off the "Expected Closure" column (I) —
    // which month a deal is actually projected to close in — not the
    // "Month" column (A) the rest of this page's Month filter otherwise
    // goes by; those are two different fields (A reads like a lead/
    // pipeline month, I is the projected closure month) and can disagree
    // for a given row. Computed from allRows (the full, unfiltered set),
    // not the possibly A-filtered `rows`, so a row whose Month (A) column
    // doesn't match the selected filter still counts here if its OWN
    // Expected Closure (I) does. Only a Topmost-priority row counts at
    // all, and never a Deal Lost one — a lost deal isn't "expected to
    // close" no matter its priority.
    var expectedClosure = expectedClosureRows(allRows, monthFilter)
      .reduce(function (s, r) { return s + num(r['Expected Deal Value (₹)']); }, 0);
    return { totalLeads: totalLeads, highPriority: highPriority, demoCompleted: demoCompleted,

    var pct = max > 0 ? Math.max(3, Math.round((value / max) * 100)) : 3;
    var gradMap = {
      'var(--brand)': 'linear-gradient(180deg,#F4845F 0%,#EC6724 60%,#C4501A 100%)',
      'var(--deep)':  'linear-gradient(180deg,#A84035 0%,#821D13 60%,#5C1009 100%)',
      'var(--ok)':    'linear-gradient(180deg,#4CAF6A 0%,#2E7D32 60%,#1B5E20 100%)',
      'var(--warn)':  'linear-gradient(180deg,#D4A82A 0%,#B8860B 60%,#8B6508 100%)',
    };
    var bg = gradMap[color] || color || 'var(--brand)';
    var style = 'height:' + pct + '%;background:' + bg;
    return '<div class="bar-col"><div class="bar-track"><div class="bar" style="' + style + '"><span class="val">' +
      (fmt ? fmt(value) : value) + '</span></div></div><div class="bar-label">' + esc(label) + '</div></div>';
  }

  // Count of rows per distinct value of `field`, sorted highest first —
  // used for the Sales Stage / Institution Type breakdown charts. Reads
  // whatever values actually appear in the data rather than a fixed list,
  // same self-heals-without-a-deploy approach as the rest of this app.
  function countBy(rows, field) {
    var counts = {};
    rows.forEach(function (r) {
      var v = (r[field] || '').toString().trim();
      if (!v) return;
      counts[v] = (counts[v] || 0) + 1;
    });
    return Object.keys(counts).map(function (k2) { return [k2, counts[k2]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
  }

    return '<div class="card" style="padding:20px 24px">' +
      '<p class="ov-eyebrow" style="text-align:center;margin:0 0 2px">' + esc(title) + '</p>' +
      subtitleHtml +

  var masterState = { loading: false, error: null, tenants: [], loaded: false };

  function loadMaster() {
    masterState.loading = true;
    masterState.error = null;
    renderMaster();
    authedFetch('/api/master').then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      masterState.loading = false;
      masterState.loaded = true;
      if (!res.ok) {
        masterState.error = res.data && res.data.error ? res.data.error : 'Failed to load master data';
        renderMaster();
        return;
      }
      masterState.tenants = res.data.tenants || [];
      renderMaster();
    }).catch(function (err) {
      masterState.loading = false;
      masterState.loaded = true;
      masterState.error = String(err);
      renderMaster();
    });
  }

      if (masterMonth === 'All') return rows;

  // by hand: setting Month + Priority + typing a search term all narrow the

  function filteredDeals() {
    var deals = state.rows.filter(function (r) {
      if (dealFilters.month !== 'All' && r.Month !== dealFilters.month) return false;
      if (dealFilters.type !== 'All' && r['Institution Type'] !== dealFilters.type) return false;
      if (dealFilters.priority !== 'All' && r.Priority !== dealFilters.priority) return false;
      if (dealFilters.stage !== 'All' && r['Sales Stage'] !== dealFilters.stage) return false;
      if (dealFilters.q) {
        var q = dealFilters.q.toLowerCase();
        var hay = ((r['Institution Name'] || '') + ' ' + (r.City || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    if (dealSort.col) {
      var colDef = DEAL_COLUMNS.filter(function (c) { return c.key === dealSort.col; })[0];
      var dir = dealSort.dir;
      deals = deals.slice().sort(function (a, b) {
        if (colDef.type === 'date') {
          // Rows with no date always sort last, in EITHER direction — "no
          // follow-up set"/"no entry date" isn't meaningfully newest or
          // oldest, so it can't be allowed to flip to the top just
          // because the column's sort direction flipped (multiplying an
          // Infinity placeholder by -1 would do exactly that).
          var ad = parseSheetDate(a[colDef.key]), bd = parseSheetDate(b[colDef.key]);
          if (!ad && !bd) return 0;
          if (!ad) return 1;
          if (!bd) return -1;
          return (ad.getTime() - bd.getTime()) * dir;
        }
        var av, bv;
        if (colDef.type === 'number') {
          av = num(a[colDef.key]); bv = num(b[colDef.key]);
        } else {
          av = (a[colDef.key] || '').toString().toLowerCase();
          bv = (b[colDef.key] || '').toString().toLowerCase();
        }
        if (av < bv) return -1 * dir;
        if (av > bv) return 1 * dir;
        return 0;
      });
    }
    return deals;
  }

  function filterSelect(id, field, current) {
    var opts = distinctValues(field);
    return '<select id="' + id + '"><option value="All">' + field + ': All</option>' +
      opts.map(function (o) { return '<option value="' + esc(o) + '"' + (current === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
      '</select>';
  }

  var STAGE_CLASS = {
    'New Lead': 'stage-new', 'Cold Calling Done': 'stage-cold',
    'Follow up': 'stage-followup', 'Demo Done': 'stage-demo',
    'Proposal Shared': 'stage-proposal', 'Technical Discussion': 'stage-tech',
    'Negotiation': 'stage-nego', 'Deal Won': 'stage-won', 'Deal Lost': 'stage-lost',
    'Campus Visit Completed': 'stage-campus', 'Support Operations': 'stage-support',
    'Follow up Next Year': 'stage-cold',
  };
  function stagePill(stage) {
    var cls = STAGE_CLASS[stage] || 'default';
    return '<span class="pill-tag ' + cls + '">' + esc(stage || '—') + '</span>';
  }
  function priorityBadge(p) {
    var color = p === 'Topmost' ? 'var(--bad)' : p === 'Medium' ? 'var(--warn)' : 'var(--faint)';
    return '<span class="priority-dot" style="color:' + color + ';--dot:' + color + '" data-p="' + esc(p) + '">' + esc(p || '—') + '</span>';
  }

  // Renders the filter toolbar + search box ONCE. Rebuilding the whole tab
  // (toolbar included) on every keystroke — the previous behaviour — tore
  // down and recreated the <input> the user was typing into, which is why
  // it lost focus after every single character. Filter/search/sort changes
  // now only touch #dealsTableWrap; the input itself is never replaced.
  function renderDeals() {
    var root = document.getElementById('tab-deals');
    if (state.loading) { root.innerHTML = '<div class="empty">Loading…</div>'; return; }

    var todayStr = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    var header =
      '<div class="ov-header" style="margin-bottom:16px">' +
        '<div class="ov-header-left">' +
          '<p class="ov-eyebrow">OD Sales Team</p>' +
          '<h2>Leads Pipeline</h2>' +
          '<p class="ov-date">' + esc(todayStr) + '</p>' +
        '</div>' +
      '</div>';

    var toolbar = '<div class="toolbar" style="margin-bottom:16px">' +
      filterSelect('f-month', 'Month', dealFilters.month) +
      filterSelect('f-type', 'Institution Type', dealFilters.type) +
      filterSelect('f-priority', 'Priority', dealFilters.priority) +
      filterSelect('f-stage', 'Sales Stage', dealFilters.stage) +
      '<input type="search" id="f-q" autocomplete="off" placeholder="Search institution / city" value="' + esc(dealFilters.q) + '" />' +
      '<button type="button" class="ghost" id="colsToggleBtn" style="font-size:12px;padding:6px 12px;white-space:nowrap">' + (dealColsExpanded ? '← Fewer columns' : 'More columns →') + '</button>' +
      '<span id="dealsCount" style="color:var(--faint);font-size:13px;"></span>' +

    root.innerHTML = header + toolbar + '<div id="dealsTableWrap"></div>';

    ['month', 'type', 'priority', 'stage'].forEach(function (k) {
      var el = document.getElementById('f-' + k);

    var qEl = document.getElementById('f-q');

    var colsBtn = document.getElementById('colsToggleBtn');

  function renderDealsTable() {
    var deals = filteredDeals();
    var countEl = document.getElementById('dealsCount');
    if (countEl) countEl.textContent = deals.length + ' lead' + (deals.length === 1 ? '' : 's');

    var wrap = document.getElementById('dealsTableWrap');

    }

    // "#" and "Visits" are both computed, not sheet columns, so — unlike
    // every column from DEAL_COLUMNS — neither is sortable.
    var visibleCols = DEAL_COLUMNS.filter(function (c) { return dealColsExpanded || !c.secondary; });
    var headHtml = '<th>#</th>' + visibleCols.map(function (c) {
      var active = dealSort.col === c.key;
      var icon = active
        ? '<span class="sort-icon active">' + (dealSort.dir === 1 ? '↑' : '↓') + '</span>'
        : '<span class="sort-icon">⇅</span>';
      return '<th class="sortable' + (active ? ' active' : '') + (c.type === 'number' ? ' num' : '') + '" data-sort="' + c.key + '">' + esc(c.label) + icon + '</th>';

    var bodyHtml = deals.map(function (r, i) {

            '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 2a4 4 0 014 4c0 3-4 8-4 8S4 9 4 6a4 4 0 014-4z" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="6" r="1.5" stroke="currentColor" stroke-width="1.5"/></svg>' +

        '<td>' + followupCell + '</td>' +
        (sec ? '<td>' + esc(r['ERP Satisfaction Score'] || '—') + '</td>' : '') +
        (sec ? '<td>' + esc(r['Product'] || '—') + '</td>' : '') +
        (sec ? '<td>' + esc(r['Pain Points'] || '—') + '</td>' : '') +

    wrap.innerHTML = '<table><thead><tr>' + headHtml + '</tr></thead><tbody>' + bodyHtml + '</tbody></table>';

    wrap.querySelectorAll('th.sortable').forEach(function (th) {

          if (td) { e.stopPropagation(); openVisitsModal(td.getAttribute('data-institution')); }

  // ---------- follow-ups ----------

  // A closed deal — won or lost — never belongs on the Follow-ups page;
  // there's nothing left to follow up on either way.
  function isClosedStage(r) {
    return r['Sales Stage'] === 'Deal Won' || r['Sales Stage'] === 'Deal Lost';
  }

  function overdueFollowupRows() {
    var today = todayUTC();
    return state.rows.filter(function (r) {
      if (isClosedStage(r)) return false;
      var d = parseSheetDate(r['Next Follow-up Date']);
      return d && d.getTime() < today.getTime();
    }).sort(function (a, b) {
      return parseSheetDate(a['Next Follow-up Date']) - parseSheetDate(b['Next Follow-up Date']);
    });
  }

  function todayFollowupRows() {
    var today = todayUTC();
    return state.rows.filter(function (r) {
      if (isClosedStage(r)) return false;
      var d = parseSheetDate(r['Next Follow-up Date']);
      return d && d.getTime() === today.getTime();
    }).sort(function (a, b) {
      return parseSheetDate(a['Next Follow-up Date']) - parseSheetDate(b['Next Follow-up Date']);
    });
  }

  // Scheduled for later than today — shown as a separate "Upcoming" section
  // below the due/overdue one, so a manager can see what's coming without
  // it being mixed into (or mistaken for) something actually due now.
  function upcomingFollowupRows() {
    var today = todayUTC();
    return state.rows.filter(function (r) {
      if (isClosedStage(r)) return false;
      var d = parseSheetDate(r['Next Follow-up Date']);
      return d && d.getTime() > today.getTime();
    }).sort(function (a, b) {
      return parseSheetDate(a['Next Follow-up Date']) - parseSheetDate(b['Next Follow-up Date']);
    });
  }

  // Picks whichever contact is actually filled in — Decision Maker first,
  // 2nd Level Contact as fallback — and returns THAT person's own
  // mobile/email, not a mismatched pairing (previously always showed the
  // 2nd contact's mobile number even when the Decision Maker was the one
  // named, since each contact has its own separate mobile/email columns).
  function primaryContact(r) {
    var useDecisionMaker = !!(r['Decision Maker'] && String(r['Decision Maker']).trim());
    return {
      name: useDecisionMaker ? r['Decision Maker'] : (r['2nd Level Contact Person'] || ''),
      mobile: useDecisionMaker ? r['Mobile No'] : r['Mobile No.'],
      email: useDecisionMaker ? r.Email : r['Email (2)']
    };
  }

  function followupItemHtml(r, todayTime) {
    var d = parseSheetDate(r['Next Follow-up Date']);
    var tagClass = 'due-today', tagText = esc(fmtSheetDate(r['Next Follow-up Date'])) + ' (today)';
    if (d.getTime() < todayTime) { tagClass = 'overdue'; tagText = esc(fmtSheetDate(r['Next Follow-up Date'])) + ' (overdue)'; }
    else if (d.getTime() > todayTime) { tagClass = ''; tagText = esc(fmtSheetDate(r['Next Follow-up Date'])); }
    var c = primaryContact(r);
    var canEmail = !!(c.email && String(c.email).trim());
    var remarks = r.Remarks && String(r.Remarks).trim();
    return '<div class="followup-item" data-row="' + r._row + '">' +
      '<div class="meta">' +
        '<div class="name">' + esc(r['Institution Name']) + ' <span class="' + tagClass + '">' + tagText + '</span></div>' +
        '<div class="sub">' + esc(stagePillText(r['Sales Stage'])) + ' · ' + esc(c.name || '—') +
          (c.mobile ? ' · ' + esc(c.mobile) : '') + '</div>' +
        (remarks ? '<div class="sub" style="margin-top:3px;font-style:italic">' + esc(remarks) + '</div>' : '') +
      '</div>' +
      '<div class="row-actions">' +
        '<button class="ghost small" data-edit="' + r._row + '">Edit</button>' +
        '<button class="pill small" data-email="' + r._row + '">Email</button>' +
      '</div>' +
    '</div>';
  }

  function renderFollowups() {
    var root = document.getElementById('tab-followups');
    if (state.loading) { root.innerHTML = '<div class="empty">Loading…</div>'; return; }
    var overdue = overdueFollowupRows();
    var todayList = todayFollowupRows();
    var upcoming = upcomingFollowupRows();
    var todayTime = todayUTC().getTime();

    var todayStr = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    var header =
      '<div class="ov-header">' +
        '<div class="ov-header-left">' +
          '<p class="ov-eyebrow">OD Sales Team</p>' +
          '<h2>Follow-ups</h2>' +
          '<p class="ov-date">' + esc(todayStr) + '</p>' +
        '</div>' +
      '</div>';

    if (overdue.length === 0 && todayList.length === 0 && upcoming.length === 0) {
      root.innerHTML = header + '<div class="empty">No follow-ups scheduled. 🎉</div>';
      return;
    }

    function section(title, color, rows, emptyText) {
      var count = rows.length;
      var inner = count
        ? rows.map(function (r) { return followupItemHtml(r, todayTime); }).join('')
        : '<div class="empty" style="padding:20px 0">' + esc(emptyText) + '</div>';
      return '<div class="card" style="margin-bottom:16px;padding:20px 24px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">' +
          '<div style="font-size:15px;font-weight:700;letter-spacing:-.01em;color:' + color + '">' + esc(title) + '</div>' +
          (count ? '<span style="background:' + color + ';color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px">' + count + '</span>' : '') +
        '</div>' +
        inner +
      '</div>';
    }

    var html = header +
      section('Overdue', 'var(--bad)', overdue, 'Nothing overdue.') +
      section('Today', 'var(--warn)', todayList, 'Nothing due today.') +
      section('Upcoming', 'var(--brand)', upcoming, 'No upcoming follow-ups scheduled.');
    root.innerHTML = html;

    root.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var row = findRow(btn.getAttribute('data-edit'));
        if (row) openFollowupDateModal(row);
      });
    });
    root.querySelectorAll('[data-email]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var row = findRow(btn.getAttribute('data-email'));
        if (row) openComposeModal(row);
      });

  // ---------- visits page (all visits, across every client, with totals) ----------

  var visitFilters = { from: '', to: '' };
  var visitSort = { col: 'last', dir: -1 }; // default: Last Visit descending

  function renderVisitsPage() {
    var root = document.getElementById('tab-visits');
    if (state.loading) { root.innerHTML = '<div class="empty">Loading…</div>'; return; }

    // visitFilters.from/to are ISO ("2026-09-24") straight from the date
    // inputs — parseSheetDate's fallback (new Date(s)) parses that form
    // natively, no conversion needed.
    var fromTime = visitFilters.from ? parseSheetDate(visitFilters.from).getTime() : null;
    var toTime = visitFilters.to ? parseSheetDate(visitFilters.to).getTime() : null;

    var visits = state.visits.filter(function (v) {
      var d = parseSheetDate(v['Visit Date']);
      if (!d) return false;
      if (fromTime !== null && d.getTime() < fromTime) return false;
      if (toTime !== null && d.getTime() > toTime) return false;
      return true;
    }).sort(function (a, b) {
      var ad = parseSheetDate(a['Visit Date']), bd = parseSheetDate(b['Visit Date']);
      return (bd ? bd.getTime() : 0) - (ad ? ad.getTime() : 0);
    });

    var todayStrV = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    var visitsPageHeader =
      '<div class="ov-header">' +
        '<div class="ov-header-left">' +
          '<p class="ov-eyebrow">OD Sales Team</p>' +
          '<h2>Visits</h2>' +
          '<p class="ov-date">' + esc(todayStrV) + '</p>' +
        '</div>' +
        '<div class="ov-header-right">' +
          '<button type="button" class="pill" id="btnLogVisit">+ Log Visit</button>' +
        '</div>' +
      '</div>';

    var toolbar = '<div class="toolbar">' +
      '<label style="font-size:13px;color:var(--faint);margin-right:6px;">From</label>' +
      '<input type="date" id="visitFilterFrom" value="' + esc(visitFilters.from) + '" />' +
      '<label style="font-size:13px;color:var(--faint);margin:0 6px 0 10px;">To</label>' +
      '<input type="date" id="visitFilterTo" value="' + esc(visitFilters.to) + '" />' +
      ((visitFilters.from || visitFilters.to) ? '<button type="button" class="ghost small" id="visitFilterClear">Clear</button>' : '') +
      '</div>';

    if (state.visits.length === 0) {
      root.innerHTML = visitsPageHeader + '<div class="empty">No visits logged yet.</div>';
      var b0 = root.querySelector('#btnLogVisit');
      if (b0) b0.addEventListener('click', openLogVisitModal);
      return;
    }
    if (visits.length === 0) {
      root.innerHTML = visitsPageHeader + toolbar + '<div class="empty">No visits in this date range.</div>';
      bindVisitFilterInputs();
      var b1 = root.querySelector('#btnLogVisit');
      if (b1) b1.addEventListener('click', openLogVisitModal);
      return;
    }

    var totalKm = visits.reduce(function (s, v) { return s + num(v['Distance (km)']); }, 0);
    var totalExpense = visits.reduce(function (s, v) { return s + visitExpenseTotal(v); }, 0);

    // Per-institution breakdown — visit count, km, expense, most recent
    // visit date, AND the client's own visits (for the timeline below),
    // sorted by whoever's had the most visits first. Grouping by client
    // rather than one flat date-sorted list is the point: a client with
    // several visits reads as one continuous history instead of being
    // scattered among every other client's visits in between.
    // How many visits happened on each date — used to split travel costs
    // (CNG, Petrol, Transport) fairly when multiple clients were visited
    // in one trip. Dining and Hotel are per-client and are never split.
    var sameDayCount = {};
    visits.forEach(function (v) {
      var dk = v['Visit Date'] || '';
      sameDayCount[dk] = (sameDayCount[dk] || 0) + 1;
    });

    var byInstitution = {};
    visits.forEach(function (v) {
      var name = v['Institution Name'] || '(unknown)';
      if (!byInstitution[name]) byInstitution[name] = { name: name, count: 0, km: 0, expense: 0, effective: 0, transport: 0, cng: 0, petrol: 0, dining: 0, hotel: 0, last: null, visits: [] };
      var entry = byInstitution[name];
      entry.count += 1;
      entry.km += num(v['Distance (km)']);
      entry.expense += visitExpenseTotal(v);
      entry.transport += num(v['Transport Cost (₹)']);
      entry.cng += num(v['CNG Amount (₹)']);
      entry.petrol += num(v['Petrol Amount (₹)']);
      entry.dining += num(v['Dining Cost (₹)']);
      entry.hotel += num(v['Hotel Cost (₹)']);
      // Effective cost: travel split by same-day clients, dining/hotel in full
      var dayCount = sameDayCount[v['Visit Date'] || ''] || 1;
      var travel = num(v['CNG Amount (₹)']) + num(v['Petrol Amount (₹)']) + num(v['Transport Cost (₹)']);
      var clientOnly = num(v['Dining Cost (₹)']) + num(v['Hotel Cost (₹)']);
      entry.effective += (travel / dayCount) + clientOnly;
      entry.visits.push(v);
      var d = parseSheetDate(v['Visit Date']);
      if (d && (!entry.last || d.getTime() > entry.last.getTime())) entry.last = d;
    });
    var institutions = Object.keys(byInstitution).map(function (k) { return byInstitution[k]; });
    var colVal = {
      name: function (e) { return e.name.toLowerCase(); },
      count: function (e) { return e.count; },
      km: function (e) { return e.km; },
      transport: function (e) { return e.transport; },
      cng: function (e) { return e.cng; },
      petrol: function (e) { return e.petrol; },
      dining: function (e) { return e.dining; },
      hotel: function (e) { return e.hotel; },
      expense: function (e) { return e.expense; },
      effective: function (e) { return e.effective; },
      avg: function (e) { return e.count ? e.effective / e.count : 0; },
      last: function (e) { return e.last ? e.last.getTime() : 0; },
    };
    institutions.sort(function (a, b) {
      var fn = colVal[visitSort.col] || colVal.last;
      var av = fn(a), bv = fn(b);
      return av < bv ? -visitSort.dir : av > bv ? visitSort.dir : 0;
    });

    var summaryRows = institutions.map(function (e) {
      return '<tr>' +
        '<td><span class="visit-lead-link" data-lead-name="' + esc(e.name) + '" title="Open lead">' + esc(e.name) + '</span></td>' +
        '<td><span class="visits-chip" data-institution="' + esc(e.name) + '" style="cursor:pointer;color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:2px">' + e.count + ' visit' + (e.count === 1 ? '' : 's') + '</span></td>' +
        '<td>' + e.km.toLocaleString('en-IN') + ' km</td>' +
        '<td>' + (e.transport ? money(e.transport) : '—') + '</td>' +
        '<td>' + (e.cng ? money(e.cng) : '—') + '</td>' +
        '<td>' + (e.petrol ? money(e.petrol) : '—') + '</td>' +
        '<td>' + (e.dining ? money(e.dining) : '—') + '</td>' +
        '<td>' + (e.hotel ? money(e.hotel) : '—') + '</td>' +
        '<td style="font-weight:700">' + (e.expense ? money(e.expense) : '—') + '</td>' +
        '<td style="color:var(--ok);font-weight:700">' + (e.effective ? money(Math.round(e.effective)) : '—') + '</td>' +
        '<td style="color:var(--ok)">' + (e.count && e.effective ? money(Math.round(e.effective / e.count)) : '—') + '</td>' +
        '<td>' + (e.visits.length
            ? e.visits
                .slice()
                .sort(function (a, b) {
                  var ad = parseSheetDate(a['Visit Date']), bd = parseSheetDate(b['Visit Date']);
                  return (bd ? bd.getTime() : 0) - (ad ? ad.getTime() : 0);
                })
                .map(function (v) { return '<div>' + esc(fmtSheetDate(v['Visit Date'])) + '</div>'; })
                .join('')
            : '—') + '</td>' +
      '</tr>';
    }).join('');

    // visits (and therefore each e.visits) is already sorted newest-first
    // from the top of this function.
    var timelineGroups = institutions.map(function (e) {
      var items = e.visits.map(function (v) {
        var expense = visitExpenseTotal(v);

        if (v['CNG KM']) fuelParts.push('CNG: ' + esc(v['CNG KM']) + ' km' + (v['CNG Amount (₹)'] ? ' / ' + money(num(v['CNG Amount (₹)'])) : ''));

          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">' +

              (fuelParts.length ? '<div class="vt-meta">' + fuelParts.join(' · ') + '</div>' : '') +
              (v.Notes ? '<div class="vt-notes">' + esc(v.Notes) + '</div>' : '') +
            '</div>' +
            '<div style="display:flex;gap:6px;flex-shrink:0">' +
              '<button type="button" class="ghost small" data-edit-visit="' + v._row + '" style="font-size:11px;padding:2px 8px">Edit</button>' +

            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      return '<div class="visit-client">' +
        '<h4><span class="visit-lead-link" data-lead-name="' + esc(e.name) + '" title="Open lead">' + esc(e.name) + '</span></h4>' +
        '<div class="client-stats">' + e.count + ' visit' + (e.count === 1 ? '' : 's') + ' &middot; ' + e.km.toLocaleString('en-IN') + ' km' +
          (e.expense ? ' &middot; ' + money(e.expense) : '') + '</div>' +
        '<div class="visit-timeline">' + items + '</div>' +
      '</div>';

    var visitKpiCells = [
      ['Total Visits', String(visits.length), 'var(--brand)'],
      ['Total KM', totalKm.toLocaleString('en-IN'), 'var(--deep)'],
      ['Clients Visited', String(institutions.length), 'var(--ok)'],
      ['Total Expense', inr(totalExpense), 'var(--warn)'],
    ].map(function (t) {
      var bg = KPI_BG[t[0]] ? 'background:' + KPI_BG[t[0]] + ';' : '';
      return '<div class="kpi-cell" style="' + bg + '">' +
        '<div class="kci-label">' + kciIcon(t[0], t[2]) + esc(t[0]) + '</div>' +
        '<div class="kci-fig">' + t[1] + '</div>' +
      '</div>';
    }).join('');
    var visitKpiGroup =
      '<div class="kpi-group" style="margin-bottom:16px">' +
        '<div class="kpi-group-head"><span class="kgi-title">Visit Summary</span></div>' +
        '<div class="kpi-cells">' + visitKpiCells + '</div>' +
      '</div>';

    var summaryCard =
      '<div class="card" style="margin-bottom:16px;padding:20px 24px">' +
        '<div style="font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--brand);margin-bottom:14px">By Client</div>' +
        '<table style="box-shadow:none;border-radius:12px;font-size:13px"><thead><tr>' +
          [['name','Institution'],['count','Visits'],['km','Total KM'],['transport','Transport'],
           ['cng','CNG'],['petrol','Petrol'],['dining','Dining'],['hotel','Hotel'],
           ['expense','Total Expense'],['effective','Effective Cost'],['avg','Avg/Visit'],['last','Visit Dates']].map(function(c) {
            var active = visitSort.col === c[0];
            var arrow = active ? (visitSort.dir === 1 ? ' ↑' : ' ↓') : '';
            return '<th data-sort-col="' + c[0] + '" style="cursor:pointer;user-select:none;color:' + (active ? 'var(--brand)' : 'var(--ink)') + ';font-weight:700;white-space:nowrap">' + c[1] + arrow + '</th>';
          }).join('') +
        '</tr></thead>' +
        '<tbody>' + summaryRows + '</tbody></table>' +
      '</div>';

    root.innerHTML = visitsPageHeader +
      toolbar +
      visitKpiGroup +
      summaryCard +
      '<div style="font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--brand);margin:0 0 14px">Timeline by Client</div>' +
      timelineGroups;

    bindVisitFilterInputs();

    var logBtn = root.querySelector('#btnLogVisit');
    if (logBtn) logBtn.addEventListener('click', openLogVisitModal);

    root.querySelectorAll('[data-sort-col]').forEach(function (th) {
      th.addEventListener('click', function () {

        if (visitSort.col === col) { visitSort.dir *= -1; } else { visitSort.col = col; visitSort.dir = col === 'name' ? 1 : -1; }
        renderVisitsPage();

    root.querySelectorAll('.visit-lead-link[data-lead-name]').forEach(function (el) {

    root.querySelectorAll('[data-edit-visit]').forEach(function (btn) {
      btn.addEventListener('click', function () {

        if (v) openVisitEditModal(v);

    root.querySelectorAll('[data-del-visit-page]').forEach(function (btn) {
      btn.addEventListener('click', function () {

          body: JSON.stringify({ _row: Number(btn.getAttribute('data-del-visit-page')) }),

          if (v['Petrol KM']) fuelParts.push('Petrol: ' + esc(v['Petrol KM']) + ' km' + (v['Petrol Amount (₹)'] ? ' / ' + money(num(v['Petrol Amount (₹)'])) : ''));

  function openFollowupDateModal(row) {
    // Sales Stage and Remarks are included here (both optional — left as-is
    // if untouched) so closing out a follow-up that's gone cold ("not
    // interested anymore") can be done in one step: reschedule, mark the
    // stage Lost/whatever, and note why, without having to separately open
    // the full deal edit form. Sales Stage is a real <select> (not a
    // text+datalist combo) so every stage the sheet allows is visible in

          '</div>' +
          (hasStage ? textField('Sales Stage', 'Sales Stage (optional)', row['Sales Stage'], { full: true, selectOptions: distinctValues('Sales Stage') }) : '') +

    document.getElementById('followupCancel').addEventListener('click', closeModal);

        saveRow(row._row, out, closeModal, restore);
      });
