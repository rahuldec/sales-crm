<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OD Sales CRM</title>
<link rel="icon" type="image/png" href="logo.png" />
<style>
/* Design language matched to the sibling kpi project (Okie Dokie CS Team KPI
   dashboard): palette sampled from the logo — orange #EC6724, wordmark
   maroon #821D13, star gold #FCDE5C — Apple system font stack, soft layered
   card shadows, pill buttons, Apple-style segmented tab control. */
:root {
  --ink: #1D1D1F;
  --body: #6E6E73;
  --faint: #86868B;
  --page: #F5F4F1;
  --card: #FFFFFF;
  --line: #D2D2D7;
  --hair: #E5E3DE;
  --brand: #EC6724;
  --brand-dark: #C4501A;
  --brand-soft: #FDF0E8;
  --deep: #821D13;
  --ok: #2E7D32;
  --ok-soft: #E9F5EA;
  --warn: #B8860B;
  --warn-soft: #FBF3DE;
  --bad: #A82A1C;
  --bad-soft: #FBEDEB;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #F2F2F5;
    --body: #A9A9B2;
    --faint: #8B8B93;
    --page: #121214;
    --card: #1C1C1F;
    --line: #313135;
    --hair: #2A2A2E;
    --brand: #EC6724;
    --brand-dark: #FF8A4C;
    --brand-soft: #3A2417;
    --deep: #E8998E;
    --ok: #5FB86B;
    --ok-soft: #16281A;
    --warn: #D9A83B;
    --warn-soft: #2E2510;
    --bad: #E8695B;
    --bad-soft: #331715;
  }
}
:root[data-theme="dark"] {
  --ink: #F2F2F5; --body: #A9A9B2; --faint: #8B8B93; --page: #121214; --card: #1C1C1F;
  --line: #313135; --hair: #2A2A2E; --brand: #EC6724; --brand-dark: #FF8A4C;
  --brand-soft: #3A2417; --deep: #E8998E; --ok: #5FB86B; --ok-soft: #16281A;
  --warn: #D9A83B; --warn-soft: #2E2510; --bad: #E8695B; --bad-soft: #331715;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
    "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 15px; line-height: 1.47; letter-spacing: -.011em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
:focus-visible { outline: 3px solid rgba(236,103,36,.5); outline-offset: 2px; border-radius: 6px; }

.masthead {
  position: sticky; top: 0; z-index: 20;
  background: var(--card); border-bottom: 1px solid var(--hair);
}
.masthead .inner {
  max-width: 1280px; margin: 0 auto; padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
}
.masthead img { width: 32px; height: 32px; display: block; flex-shrink: 0; border-radius: 50%; }
.masthead .name { font-size: 16px; font-weight: 700; letter-spacing: -.015em; color: var(--ink); line-height: 1.2; }
.masthead .name span { display: block; color: var(--faint); font-weight: 400; font-size: 11px; margin-top: 1px; }
.spacer { flex: 1; }

/* Apple-style segmented control for the primary tabs */
.presets { display: inline-flex; background: var(--page); border-radius: 11px; padding: 2px; }
.presets button {
  font: inherit; font-size: 14px; font-weight: 500; letter-spacing: -.01em;
  border: 0; background: none; color: var(--body); padding: 7px 16px; border-radius: 9px;
  cursor: pointer; transition: background .2s ease, color .2s ease, box-shadow .2s ease;
}
.presets button:hover { color: var(--ink); }
.presets button[aria-pressed="true"] {
  background: var(--card); color: var(--ink); font-weight: 600;
  box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 0 0 .5px rgba(0,0,0,.04);
}

button.pill {
  font: inherit; font-size: 14px; font-weight: 600; letter-spacing: -.01em;
  border: 0; border-radius: 980px; padding: 9px 18px; cursor: pointer;
  background: var(--brand); color: #fff; transition: background .2s ease, transform .1s ease;
}
button.pill:hover { background: var(--brand-dark); }
button.pill:active { transform: scale(.97); }
button.ghost {
  font: inherit; font-size: 14px; font-weight: 600; letter-spacing: -.01em;
  border: 0; border-radius: 980px; padding: 9px 18px; cursor: pointer;
  background: var(--page); color: var(--ink);
}
button.ghost:hover { background: var(--hair); }
button.small { padding: 6px 13px; font-size: 13px; border-radius: 8px; }
button[disabled] { opacity: .4; pointer-events: none; }

main { padding: 24px 24px 60px; max-width: 1280px; margin: 0 auto; }

/* Page masthead + divider — the Overview tab's own opening, styled exactly
   like the follow-up digest email's masthead (api/followup-digest.js):
   centered eyebrow, bold headline, gray date line, hairline rule after. */
.page-masthead { text-align: center; margin-bottom: 24px; }
.page-masthead .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--brand-dark); margin: 0 0 10px; }
.page-masthead h1 { font-size: 23px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); margin: 0 0 6px; }
.page-masthead .date { font-size: 14px; color: var(--body); margin: 0; }
.divider { border: none; border-top: 1px solid var(--hair); margin: 24px 0; }

.banner { padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-bottom: 18px; }
.banner.error { background: var(--bad-soft); color: var(--bad); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
select, input[type=text], input[type=number], input[type=search], textarea {
  background: var(--page); color: var(--ink);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 11px; font-size: 13px; font-family: inherit;
}
input:focus, select:focus, textarea:focus { border-color: var(--brand); }

/* KPI tiles, matched to kpi's .kpi/.fig/.lab shape */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
/* On desktop widths, force every KPI tile onto one row instead of
   wrapping — auto-fit alone wraps once there isn't room for another
   160px column, which orphaned the 8th tile onto its own row. */
@media (min-width: 860px) {
  .kpis { grid-template-columns: repeat(8, 1fr); }
  .kpi { padding: 16px 14px 14px; }
  .kpi .fig { font-size: 24px; }
}
/* Flat bordered cards, not shadow/elevation — matches the follow-up digest
   email's .email-container (api/followup-digest.js: white card, 1px hairline
   border, 12px radius, no shadow) rather than the "floating app panel" look
   shadows read as. Modals keep their shadow — those really are an
   overlay floating above the page, which the email has no equivalent of. */
.kpi {
  background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 20px 20px 18px;
  text-align: center;
}
.kpi .fig { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .lab { font-size: 13px; font-weight: 600; letter-spacing: -.005em; color: var(--faint); margin-top: 10px; text-transform: uppercase; letter-spacing: .03em; font-size: 11px; }
.kpi-icon {
  width: 34px; height: 34px; border-radius: 10px; background: var(--brand-soft);
  display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
  margin-left: auto; margin-right: auto;
}
.kpi-icon svg { width: 18px; height: 18px; color: var(--brand); }

.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.bars.scroll { overflow-x: auto; justify-content: flex-start; }
.bars.scroll .bar-col { flex: 0 0 64px; }
@media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
.card {
  background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 24px;
}
/* section-eyebrow / section-headline, straight out of the digest email's
   sectionHead() — centered uppercase colored label + a centered gray
   sentence underneath, instead of a plain left-aligned bold label. */
.card h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; text-align: center; color: var(--brand); }
.card .subtitle { margin: 8px 0 20px; font-size: 13px; font-weight: 500; color: var(--body); text-align: center; }
.bars { display: flex; align-items: flex-end; gap: 14px; padding-top: 22px; }
.bar-col { display: flex; flex-direction: column; align-items: center; flex: 1; }
/* A fixed-height track for the bar, separate from the label below it — the
   bar's height:X% needs a denominator that's ONLY the bar's own space. When
   .bar and .bar-label shared one flex column, a near-100% bar's height
   collided with the label's space and flexbox silently shrank both by
   different, bar-specific amounts — the tallest bar in a chart ended up a
   few px shorter than the rest, which is what "bars going up and down"
   actually was (every bar under ~30% never triggered it, so it looked
   patternless). Fixed track + fixed-height label below means every column
   is the same total height regardless of that bar's own percentage. */
.bar-track { height: 130px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.bar { width: 100%; max-width: 40px; border-radius: 6px 6px 2px 2px; background: var(--brand); position: relative; }
.bar .val {
  position: absolute; top: -19px; left: 50%; transform: translateX(-50%);
  width: max-content; white-space: nowrap; text-align: center;
  font-size: 11px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums;
}
/* Fixed height (not auto) — a 1-line label ("Deals Won") and a 2-line one
   ("Demo Completed") must take up the same space so every column's total
   height matches regardless of how many lines its own label wraps to. */
.bar-label { font-size: 11px; color: var(--faint); margin-top: 8px; text-align: center; line-height: 1.25; height: 28px; overflow: hidden; }

table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border: 1px solid var(--hair); border-radius: 12px; overflow: hidden; }
thead th { text-align: left; background: var(--page); color: var(--faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; padding: 11px 14px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--ink); }
thead th.sortable.active { color: var(--brand); }
.sort-icon { display: inline-block; margin-left: 5px; font-size: 10px; opacity: .4; }
.sort-icon.active { opacity: 1; color: var(--brand); font-weight: 700; }
thead th.sortable:hover .sort-icon { opacity: .8; }
tbody td { padding: 12px 14px; border-bottom: 1px solid var(--hair); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--brand-soft); cursor: pointer; }

.pill-tag { display: inline-block; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill-tag.won { background: var(--ok-soft); color: var(--ok); }
.pill-tag.default { background: var(--hair); color: var(--body); }
.overdue { color: var(--bad); font-weight: 700; }
.due-today { color: var(--warn); font-weight: 700; }
.empty { padding: 48px; text-align: center; color: var(--faint); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(20,16,14,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 100; }
.modal { background: var(--card); border-radius: 18px; width: 100%; max-width: 640px; padding: 26px; box-shadow: 0 24px 64px rgba(0,0,0,.26), 0 2px 8px rgba(0,0,0,.08); }
.modal h2 { margin: 0 0 18px; font-size: 18px; font-weight: 700; letter-spacing: -.015em; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.field label { display: block; font-size: 12px; color: var(--faint); font-weight: 600; margin-bottom: 5px; }
.field select, .field input, .field textarea { width: 100%; }
.field textarea { min-height: 70px; resize: vertical; }
.modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.modal-actions .spacer { flex: 1; }
.row-actions { display: flex; gap: 6px; }

/* New Deal wizard — one form, several steps that slide horizontally. */
.wizard-modal { max-width: 560px; }
.wizard-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.wizard-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.wizard-dots { display: flex; gap: 6px; flex-shrink: 0; }
.wizard-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--hair); border: 0; padding: 0; cursor: pointer; transition: width .2s ease, background .2s ease; }
.wizard-dot.active { background: var(--brand); width: 18px; border-radius: 4px; }
.wizard-viewport { overflow: hidden; }
.wizard-track { display: flex; transition: transform .32s cubic-bezier(.4,0,.2,1); }
.wizard-step { flex: 0 0 100%; min-width: 0; }

.followup-item { background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.followup-item .meta { flex: 1; min-width: 0; }
.followup-item .name { font-weight: 700; font-size: 14px; letter-spacing: -.01em; }
.followup-item .sub { font-size: 12px; color: var(--faint); margin-top: 3px; }

.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.auth-card { background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 34px 28px 28px; text-align: center; max-width: 360px; width: 100%; }
.auth-card img { width: 64px; height: 64px; border-radius: 50%; margin-bottom: 18px; }
.auth-card h1 { font-size: 20px; margin: 0 0 8px; font-weight: 700; letter-spacing: -.02em; }
.auth-card p { font-size: 14px; color: var(--body); margin: 0 0 22px; line-height: 1.5; }
.auth-card button.pill { width: 100%; padding: 11px 22px; }
.auth-card .hint { margin-top: 16px; font-size: 13px; color: var(--faint); }

.who-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 8px 24px; max-width: 1280px; margin: 0 auto; }
.who-row .who { font-size: 13px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: min(240px, 40vw); }
.who-row button.ghost { padding: 6px 13px; font-size: 13px; }

.master-tenant { margin-bottom: 28px; }
.master-tenant h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 14px; }
.master-tenant .tenant-error { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<div id="authGate" class="auth-wrap">
  <div class="auth-card">
    <img src="logo.png" alt="Okie Dokie" />
    <h1>OD Sales CRM</h1>
    <p>Sign in to view your sales pipeline.</p>
    <form id="loginForm">
      <div class="field" style="text-align:left;margin-bottom:10px;">
        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" name="username" autocomplete="username" required />
      </div>
      <div class="field" style="text-align:left;margin-bottom:16px;">
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="pill" id="loginSubmit">Sign in</button>
    </form>
    <div class="hint" id="authHint"></div>
  </div>
</div>

<div id="app" style="display:none">
<header class="masthead">
  <div class="inner">
    <img src="logo.png" alt="Okie Dokie" />
    <div class="name">OD Sales CRM<span>Institution sales pipeline</span></div>
    <div class="spacer"></div>
    <nav class="presets" id="nav">
      <button data-tab="overview" aria-pressed="true">Overview</button>
      <button data-tab="deals" aria-pressed="false">Deals</button>
      <button data-tab="followups" aria-pressed="false">Follow-ups</button>
      <button data-tab="master" aria-pressed="false" id="masterTabBtn" style="display:none">Master</button>
    </nav>
    <button class="pill" id="newDealBtn">+ New deal</button>
  </div>
</header>
<div class="who-row" id="whoRow" style="display:none">
  <span class="who" id="whoText"></span>
  <button class="ghost" id="logoutBtn">Sign out</button>
</div>

<main>
  <div id="banner"></div>
  <div id="tab-overview"></div>
  <div id="tab-deals" style="display:none"></div>
  <div id="tab-followups" style="display:none"></div>
  <div id="tab-master" style="display:none"></div>
</main>
</div><!-- #app -->

<div id="modalRoot"></div>

<script>
(function () {
  'use strict';

  var state = { headers: [], rows: [], loading: true, error: null, tab: 'overview', month: 'All' };
  var me = { name: '', isManager: false, isHead: false };

  var CORE_FIELDS = ['Month', 'Institution Name', 'City', 'Institution Type', 'Student Strength', 'Priority',
    'Sales Stage', 'Expected Deal Value (₹)', 'Expected Closure', 'Decision Maker', 'Designation',
    '2nd Level Contact Person', 'Designation (2)', 'Mobile No.', 'Email', 'Current ERP', 'ERP Satisfaction',
    'Lead Source', 'First Contact Date', 'Last Interaction Date', 'Next Follow-up Date', 'Demo Status',
    'Proposal Status', 'Price Discussion', 'Probability (%)', 'Implementation Readiness', 'Remarks'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fieldsPresent() {
    // Use whichever of CORE_FIELDS actually exist in this sheet's headers,
    // so a renamed/removed column degrades gracefully instead of crashing.
    return CORE_FIELDS.filter(function (f) { return state.headers.indexOf(f) !== -1; });
  }

  function distinctValues(field) {
    var seen = {};
    state.rows.forEach(function (r) {
      var v = (r[field] || '').toString().trim();
      if (v) seen[v] = true;
    });
    return Object.keys(seen).sort();
  }

  function num(v) {
    var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''));
    return isNaN(n) ? 0 : n;
  }

  function money(n) {
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }

  // Indian short scale (same convention as the sibling kpi project): crore
  // above 1,00,00,000, lakh above 1,00,000, plain below. Used anywhere space
  // is tight (KPI tiles, chart bar labels) — "₹24,55,000" doesn't wrap (no
  // spaces) and overflows a narrow box; "₹24.55L" reliably fits.
  function inr(n) {
    return '₹' + (
      n >= 1e7 ? (n / 1e7).toFixed(2).replace(/\.00$/, '') + 'Cr'
      : n >= 1e5 ? (n / 1e5).toFixed(1).replace(/\.0$/, '') + 'L'
      : Math.round(n).toLocaleString('en-IN'));
  }

  // Sheet dates: "5/8/2026" (D/M/YYYY) or free text like "July 26". Returns a
  // Date or null — never throws, since sheet data is hand-entered and messy.
  function parseSheetDate(raw) {
    if (!raw) return null;
    var s = String(raw).trim();
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if (m) {
      var y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
      return new Date(Date.UTC(y, Number(m[2]) - 1, Number(m[1])));
    }
    var d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }

  function todayUTC() {
    var n = new Date();
    return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
  }

  // ---------- data loading ----------

  function showBanner(msg, kind) {
    var el = document.getElementById('banner');
    if (!msg) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="banner ' + (kind || 'error') + '">' + esc(msg) + '</div>';
  }

  // ---------- session (plain username/password, HTTP Basic Auth) ----------
  // Kept in sessionStorage — per-viewer convenience (survives a reload,
  // never reaches Claude or any other viewer, cleared when the tab closes)
  // — never in localStorage, which would linger indefinitely. Wrapped in
  // try/catch since storage can throw (private browsing, blocked cookies).

  var SESSION_KEY = 'salescrm.session';

  function readSession() {
    try {
      var raw = sessionStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function writeSession(basic) {
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ basic: basic })); } catch (e) {}
  }
  function clearSession() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  }

  // Attaches the logged-in session (if any) as HTTP Basic Auth — the server
  // re-checks it against the Credentials tab on every call (lib/auth.js)
  // rather than trusting anything else about the request, so this is just
  // carrying proof of who is asking, not an authorization decision made
  // client-side.
  function authedFetch(url, options) {
    options = options || {};
    var session = readSession();
    var headers = {};
    for (var k in (options.headers || {})) headers[k] = options.headers[k];
    if (session && session.basic) headers.Authorization = 'Basic ' + session.basic;
    var merged = {};
    for (var k2 in options) merged[k2] = options[k2];
    merged.headers = headers;
    return fetch(url, merged);
  }

  function load() {
    state.loading = true;
    render();
    authedFetch('/api/sheet').then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      state.loading = false;
      if (!res.ok) {
        state.error = res.data && res.data.error ? res.data.error : 'Failed to load sheet';
        showBanner('Could not load data from the sheet: ' + state.error +
          '. Check your registry row has a working Sheet Bridge URL/Token — see SETUP.md.', 'error');
        render();
        return;
      }
      state.error = null;
      state.headers = res.data.headers || [];
      state.rows = res.data.rows || [];
      showBanner('');
      render();
    }).catch(function (err) {
      state.loading = false;
      state.error = String(err);
      showBanner('Network error loading data: ' + err, 'error');
      render();
    });
  }

  function saveRow(rowNumber, fields, onDone) {
    authedFetch('/api/sheet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(rowNumber ? { _row: rowNumber, fields: fields } : { fields: fields }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { showBanner('Save failed: ' + (res.d.error || 'unknown error'), 'error'); return; }
        showBanner(rowNumber ? 'Deal updated.' : 'Deal added.', 'ok');
        onDone && onDone();
        load();
      }).catch(function (err) { showBanner('Save failed: ' + err, 'error'); });
  }

  function sendEmailReq(payload, onDone) {
    authedFetch('/api/email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { showBanner('Email failed to send: ' + (res.d.error || 'unknown error'), 'error'); return; }
        showBanner('Email sent to ' + payload.to + '.', 'ok');
        onDone && onDone();
        load();
      }).catch(function (err) { showBanner('Email failed to send: ' + err, 'error'); });
  }

  // ---------- overview ----------

  function monthOptions() {
    return distinctValues('Month');
  }

  function overviewRows() {
    if (state.month === 'All') return state.rows;
    return state.rows.filter(function (r) { return r.Month === state.month; });
  }

  function computeKpis(rows) {
    var totalLeads = rows.length;
    var highPriority = rows.filter(function (r) { return r.Priority === 'Topmost'; }).length;
    var demoCompleted = rows.filter(function (r) { return r['Demo Status'] === 'Completed'; }).length;
    var proposalShared = rows.filter(function (r) {
      var v = r['Proposal Status'];
      return v && v !== 'Not Shared';
    }).length;
    var underPriceDiscussion = rows.filter(function (r) {
      var v = r['Price Discussion'];
      return v && v !== 'Not Started' && v !== 'Price Finalized';
    }).length;
    var dealsWon = rows.filter(function (r) { return r['Sales Stage'] === 'Deal Won'; }).length;
    var pipelineValue = rows.reduce(function (s, r) { return s + num(r['Expected Deal Value (₹)']); }, 0);
    var expectedClosure = rows.filter(function (r) { return r['Sales Stage'] === 'Deal Won'; })
      .reduce(function (s, r) { return s + num(r['Expected Deal Value (₹)']); }, 0);
    return { totalLeads: totalLeads, highPriority: highPriority, demoCompleted: demoCompleted,
      proposalShared: proposalShared, underPriceDiscussion: underPriceDiscussion, dealsWon: dealsWon,
      pipelineValue: pipelineValue, expectedClosure: expectedClosure };
  }

  function bar(value, max, label, fmt, color) {
    var pct = max > 0 ? Math.max(2, Math.round((value / max) * 100)) : 2;
    var style = 'height:' + pct + '%' + (color ? ';background:' + color : '');
    return '<div class="bar-col"><div class="bar-track"><div class="bar" style="' + style + '"><span class="val">' +
      (fmt ? fmt(value) : value) + '</span></div></div><div class="bar-label">' + esc(label) + '</div></div>';
  }

  // Count of rows per distinct value of `field`, sorted highest first —
  // used for the Sales Stage / Institution Type breakdown charts. Reads
  // whatever values actually appear in the data rather than a fixed list,
  // same self-heals-without-a-deploy approach as the rest of this app.
  function countBy(rows, field) {
    var counts = {};
    rows.forEach(function (r) {
      var v = (r[field] || '').toString().trim();
      if (!v) return;
      counts[v] = (counts[v] || 0) + 1;
    });
    return Object.keys(counts).map(function (k2) { return [k2, counts[k2]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
  }

  function breakdownChart(title, pairs, color, subtitle) {
    if (pairs.length === 0) return '';
    var max = Math.max.apply(null, pairs.map(function (p) { return p[1]; }).concat(1));
    var bars = pairs.map(function (p) { return bar(p[1], max, p[0], null, color); }).join('');
    var h3Style = color ? ' style="color:' + color + '"' : '';
    var subtitleHtml = subtitle ? '<p class="subtitle">' + esc(subtitle) + '</p>' : '';
    return '<div class="card"><h3' + h3Style + '>' + esc(title) + '</h3>' + subtitleHtml + '<div class="bars scroll">' + bars + '</div></div>';
  }

  // Small line-icon badges for the KPI tiles (inline SVG — no icon font/CDN,
  // consistent with this app having zero external dependencies).
  var KPI_ICONS = {
    'Total Leads': '<circle cx="9" cy="7" r="4"/><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>',
    'High Priority': '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
    'Demo Completed': '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 17.01"/>',
    'Proposal Shared': '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
    'Under Price Discussion': '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
    'Deals Won': '<circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>',
    'Pipeline Value': '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
    'Expected Closure': '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/>'
  };

  function kpiIcon(label) {
    var paths = KPI_ICONS[label];
    if (!paths) return '';
    return '<div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg></div>';
  }

  // Shared by the Overview tab and each tenant block on the Master tab —
  // one computeKpis() result in, one row of tiles out.
  function kpiTilesHtml(k) {
    return [
      ['Total Leads', k.totalLeads],
      ['High Priority', k.highPriority],
      ['Demo Completed', k.demoCompleted],
      ['Proposal Shared', k.proposalShared],
      ['Under Price Discussion', k.underPriceDiscussion],
      ['Deals Won', k.dealsWon],
      ['Pipeline Value', inr(k.pipelineValue)],
      ['Expected Closure', inr(k.expectedClosure)],
    ].map(function (t) {
      return '<div class="kpi">' + kpiIcon(t[0]) + '<div class="fig">' + t[1] + '</div><div class="lab">' + esc(t[0]) + '</div></div>';
    }).join('');
  }

  function renderOverview() {
    var root = document.getElementById('tab-overview');
    if (state.loading) { root.innerHTML = '<div class="empty">Loading…</div>'; return; }
    var rows = overviewRows();
    var k = computeKpis(rows);
    var months = monthOptions();

    var monthSelect = '<select id="monthFilter"><option value="All"' + (state.month === 'All' ? ' selected' : '') + '>All months</option>' +
      months.map(function (m) { return '<option value="' + esc(m) + '"' + (state.month === m ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('') +
      '</select>';

    var tiles = kpiTilesHtml(k);

    // Each chart gets its own accent instead of every bar being the same
    // orange — still the logo-sampled palette (orange/maroon/gold) plus the
    // existing green/amber status colors, not an arbitrary new hue.
    var funnelMax = Math.max(k.totalLeads, k.highPriority, k.demoCompleted, k.proposalShared, k.underPriceDiscussion, k.dealsWon, 1);
    var funnel = bar(k.totalLeads, funnelMax, 'Total Leads', null, 'var(--brand)') + bar(k.highPriority, funnelMax, 'High Priority', null, 'var(--brand)') +
      bar(k.demoCompleted, funnelMax, 'Demo Completed', null, 'var(--brand)') + bar(k.proposalShared, funnelMax, 'Proposal Shared', null, 'var(--brand)') +
      bar(k.underPriceDiscussion, funnelMax, 'Price Discussion', null, 'var(--brand)') + bar(k.dealsWon, funnelMax, 'Deals Won', null, 'var(--brand)');

    var bizMax = Math.max(k.pipelineValue, k.expectedClosure, 1);
    var biz = bar(k.pipelineValue, bizMax, 'Pipeline Value', inr, 'var(--deep)') + bar(k.expectedClosure, bizMax, 'Expected Closure (Won)', inr, 'var(--deep)');

    var typeChart = breakdownChart('Deals by Institution Type', countBy(rows, 'Institution Type'), 'var(--warn)',
      countBy(rows, 'Institution Type').length + ' institution type' + (countBy(rows, 'Institution Type').length === 1 ? '' : 's') + ' represented');
    var sourceChart = breakdownChart('Deals by Lead Source', countBy(rows, 'Lead Source'), 'var(--ok)',
      countBy(rows, 'Lead Source').length + ' lead source' + (countBy(rows, 'Lead Source').length === 1 ? '' : 's') + ' tracked');

    // Masthead — same eyebrow / headline / date shape as the follow-up
    // digest email's own masthead (api/followup-digest.js), centered, with
    // a hairline divider closing it off, so the page opens the same way
    // the email does instead of dropping straight into a filter bar.
    var todayStr = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    var masthead =
      '<div class="page-masthead">' +
        '<p class="eyebrow">OD Sales Team</p>' +
        '<h1>Sales Overview</h1>' +
        '<p class="date">' + esc(todayStr) + '</p>' +
      '</div><hr class="divider">';

    root.innerHTML = masthead +
      '<div class="toolbar"><label style="font-size:13px;color:var(--faint);margin-right:6px;">Month</label>' + monthSelect + '</div>' +
      '<div class="kpis">' + tiles + '</div>' +
      '<hr class="divider">' +
      '<div class="charts">' +
        '<div class="card"><h3 style="color:var(--brand)">Sales Funnel</h3>' +
          '<p class="subtitle">' + k.totalLeads + ' total leads &middot; ' + k.dealsWon + ' deal' + (k.dealsWon === 1 ? '' : 's') + ' won</p>' +
          '<div class="bars">' + funnel + '</div></div>' +
        '<div class="card"><h3 style="color:var(--deep)">Expected Business</h3>' +
          '<p class="subtitle">' + inr(k.pipelineValue) + ' pipeline &middot; ' + inr(k.expectedClosure) + ' won</p>' +
          '<div class="bars">' + biz + '</div></div>' +
      '</div>' +
      '<div class="charts">' + typeChart + sourceChart + '</div>';

    document.getElementById('monthFilter').addEventListener('change', function (e) {
      state.month = e.target.value;
      renderOverview();
    });
  }

  // ---------- master (head-only rollup across every manager) ----------

  var masterState = { loading: false, error: null, tenants: [], loaded: false };

  function loadMaster() {
    masterState.loading = true;
    masterState.error = null;
    renderMaster();
    authedFetch('/api/master').then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      masterState.loading = false;
      masterState.loaded = true;
      if (!res.ok) {
        masterState.error = res.data && res.data.error ? res.data.error : 'Failed to load master data';
        renderMaster();
        return;
      }
      masterState.tenants = res.data.tenants || [];
      renderMaster();
    }).catch(function (err) {
      masterState.loading = false;
      masterState.loaded = true;
      masterState.error = String(err);
      renderMaster();
    });
  }

  function renderMaster() {
    var root = document.getElementById('tab-master');
    if (masterState.loading) { root.innerHTML = '<div class="empty">Loading…</div>'; return; }
    if (masterState.error) {
      root.innerHTML = '<div class="banner error">' + esc(masterState.error) + '</div>';
      return;
    }
    if (masterState.tenants.length === 0) {
      root.innerHTML = '<div class="empty">No manager sheets are set up yet in the registry.</div>';
      return;
    }

    var combinedRows = [];
    var blocks = masterState.tenants.map(function (t) {
      if (!t.ok) {
        return '<div class="master-tenant"><h2>' + esc(t.name) + '</h2>' +
          '<div class="tenant-error">Could not load this manager\'s sheet: ' + esc(t.error) + '</div></div>';
      }
      combinedRows = combinedRows.concat(t.rows || []);
      var k = computeKpis(t.rows || []);
      return '<div class="master-tenant"><h2>' + esc(t.name) + '</h2><div class="kpis">' + kpiTilesHtml(k) + '</div></div>';
    }).join('');

    var combinedK = computeKpis(combinedRows);
    var combinedBlock = '<div class="master-tenant"><h2 style="color:var(--brand)">Combined — All Managers</h2>' +
      '<div class="kpis">' + kpiTilesHtml(combinedK) + '</div></div><hr class="divider">';

    var todayStr = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    var masthead =
      '<div class="page-masthead">' +
        '<p class="eyebrow">OD Sales Team</p>' +
        '<h1>Master Dashboard</h1>' +
        '<p class="date">' + esc(todayStr) + '</p>' +
      '</div><hr class="divider">';

    root.innerHTML = masthead + combinedBlock + blocks;
  }

  // ---------- deals table ----------

  var dealFilters = { month: 'All', type: 'All', priority: 'All', stage: 'All', q: '' };
  // null sortCol = sheet order (whatever filteredDeals() returns as-is).
  var dealSort = { col: null, dir: 1 };

  var DEAL_COLUMNS = [
    { key: 'Institution Name', label: 'Institution', type: 'text' },
    { key: 'City', label: 'City', type: 'text' },
    { key: 'Institution Type', label: 'Type', type: 'text' },
    { key: 'Priority', label: 'Priority', type: 'text' },
    { key: 'Sales Stage', label: 'Stage', type: 'text' },
    { key: 'Expected Deal Value (₹)', label: 'Value', type: 'number' },
    { key: 'Expected Closure', label: 'Expected Closure', type: 'text' },
    { key: 'Next Follow-up Date', label: 'Next Follow-up', type: 'date' }
  ];

  // Filters ANDed together: an exact match per dropdown, plus a substring
  // match on institution name / city for the free-text search. Cross-check
  // by hand: setting Month + Priority + typing a search term all narrow the
  // same result set further, never independently of each other.
  function filteredDeals() {
    var deals = state.rows.filter(function (r) {
      if (dealFilters.month !== 'All' && r.Month !== dealFilters.month) return false;
      if (dealFilters.type !== 'All' && r['Institution Type'] !== dealFilters.type) return false;
      if (dealFilters.priority !== 'All' && r.Priority !== dealFilters.priority) return false;
      if (dealFilters.stage !== 'All' && r['Sales Stage'] !== dealFilters.stage) return false;
      if (dealFilters.q) {
        var q = dealFilters.q.toLowerCase();
        var hay = ((r['Institution Name'] || '') + ' ' + (r.City || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    if (dealSort.col) {
      var colDef = DEAL_COLUMNS.filter(function (c) { return c.key === dealSort.col; })[0];
      var dir = dealSort.dir;
      deals = deals.slice().sort(function (a, b) {
        var av, bv;
        if (colDef.type === 'number') {
          av = num(a[colDef.key]); bv = num(b[colDef.key]);
        } else if (colDef.type === 'date') {
          var ad = parseSheetDate(a[colDef.key]), bd = parseSheetDate(b[colDef.key]);
          // Rows with no date always sort last, in either direction —
          // "no follow-up set" isn't meaningfully before or after a date.
          av = ad ? ad.getTime() : Infinity; bv = bd ? bd.getTime() : Infinity;
        } else {
          av = (a[colDef.key] || '').toString().toLowerCase();
          bv = (b[colDef.key] || '').toString().toLowerCase();
        }
        if (av < bv) return -1 * dir;
        if (av > bv) return 1 * dir;
        return 0;
      });
    }
    return deals;
  }

  function filterSelect(id, field, current) {
    var opts = distinctValues(field);
    return '<select id="' + id + '"><option value="All">' + field + ': All</option>' +
      opts.map(function (o) { return '<option value="' + esc(o) + '"' + (current === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
      '</select>';
  }

  function stagePill(stage) {
    var cls = stage === 'Deal Won' ? 'won' : 'default';
    return '<span class="pill-tag ' + cls + '">' + esc(stage || '—') + '</span>';
  }

  // Renders the filter toolbar + search box ONCE. Rebuilding the whole tab
  // (toolbar included) on every keystroke — the previous behaviour — tore
  // down and recreated the <input> the user was typing into, which is why
  // it lost focus after every single character. Filter/search/sort changes
  // now only touch #dealsTableWrap; the input itself is never replaced.
  function renderDeals() {
    var root = document.getElementById('tab-deals');
    if (state.loading) { root.innerHTML = '<div class="empty">Loading…</div>'; return; }

    var toolbar = '<div class="toolbar">' +
      filterSelect('f-month', 'Month', dealFilters.month) +
      filterSelect('f-type', 'Institution Type', dealFilters.type) +
      filterSelect('f-priority', 'Priority', dealFilters.priority) +
      filterSelect('f-stage', 'Sales Stage', dealFilters.stage) +
      '<input type="search" id="f-q" autocomplete="off" placeholder="Search institution / city" value="' + esc(dealFilters.q) + '" />' +
      '<span id="dealsCount" style="color:var(--faint);font-size:13px;"></span>' +
      '</div>';

    root.innerHTML = toolbar + '<div id="dealsTableWrap"></div>';

    ['month', 'type', 'priority', 'stage'].forEach(function (k) {
      var el = document.getElementById('f-' + k);
      if (el) el.addEventListener('change', function (e) { dealFilters[k] = e.target.value; renderDealsTable(); });
    });
    var qEl = document.getElementById('f-q');
    if (qEl) qEl.addEventListener('input', function (e) { dealFilters.q = e.target.value; renderDealsTable(); });

    renderDealsTable();
  }

  function renderDealsTable() {
    var deals = filteredDeals();
    var countEl = document.getElementById('dealsCount');
    if (countEl) countEl.textContent = deals.length + ' deal' + (deals.length === 1 ? '' : 's');

    var wrap = document.getElementById('dealsTableWrap');
    if (!wrap) return;

    if (deals.length === 0) {
      wrap.innerHTML = '<div class="empty">No deals match these filters.</div>';
      return;
    }

    var headHtml = DEAL_COLUMNS.map(function (c) {
      var active = dealSort.col === c.key;
      // Every sortable header carries a faint ⇅ hint so it reads as
      // clickable even before it's ever been sorted — previously only the
      // currently-active column showed any arrow at all, so the other
      // columns didn't look sortable in the first place.
      var icon = active
        ? '<span class="sort-icon active">' + (dealSort.dir === 1 ? '↑' : '↓') + '</span>'
        : '<span class="sort-icon">⇅</span>';
      return '<th class="sortable' + (active ? ' active' : '') + '" data-sort="' + c.key + '">' + esc(c.label) + icon + '</th>';
    }).join('');

    var bodyHtml = deals.map(function (r) {
      return '<tr data-row="' + r._row + '">' +
        '<td>' + esc(r['Institution Name']) + '</td>' +
        '<td>' + esc(r.City) + '</td>' +
        '<td>' + esc(r['Institution Type']) + '</td>' +
        '<td>' + esc(r.Priority) + '</td>' +
        '<td>' + stagePill(r['Sales Stage']) + '</td>' +
        '<td>' + (r['Expected Deal Value (₹)'] ? money(num(r['Expected Deal Value (₹)'])) : '—') + '</td>' +
        '<td>' + esc(r['Expected Closure']) + '</td>' +
        '<td>' + esc(r['Next Follow-up Date']) + '</td>' +
      '</tr>';
    }).join('');

    wrap.innerHTML = '<table><thead><tr>' + headHtml + '</tr></thead><tbody>' + bodyHtml + '</tbody></table>';

    wrap.querySelectorAll('th.sortable').forEach(function (th) {
      th.addEventListener('click', function () {
        var col = th.getAttribute('data-sort');
        if (dealSort.col === col) { dealSort.dir = -dealSort.dir; }
        else { dealSort.col = col; dealSort.dir = 1; }
        renderDealsTable();
      });
    });

    wrap.querySelectorAll('tbody tr').forEach(function (tr) {
      tr.addEventListener('click', function () {
        var row = state.rows.filter(function (r) { return String(r._row) === tr.getAttribute('data-row'); })[0];
        if (row) openDealModal(row);
      });
    });
  }

  // ---------- follow-ups ----------

  function followupRows() {
    var today = todayUTC();
    return state.rows.filter(function (r) {
      if (r['Sales Stage'] === 'Deal Won') return false;
      var d = parseSheetDate(r['Next Follow-up Date']);
      return d && d.getTime() <= today.getTime();
    }).sort(function (a, b) {
      return parseSheetDate(a['Next Follow-up Date']) - parseSheetDate(b['Next Follow-up Date']);
    });
  }

  function renderFollowups() {
    var root = document.getElementById('tab-followups');
    if (state.loading) { root.innerHTML = '<div class="empty">Loading…</div>'; return; }
    var due = followupRows();
    var today = todayUTC();

    if (due.length === 0) {
      root.innerHTML = '<div class="empty">No follow-ups due. 🎉</div>';
      return;
    }

    root.innerHTML = due.map(function (r) {
      var d = parseSheetDate(r['Next Follow-up Date']);
      var overdue = d.getTime() < today.getTime();
      var contact = r['Decision Maker'] || r['2nd Level Contact Person'] || '—';
      var canEmail = !!(r.Email && String(r.Email).trim());
      return '<div class="followup-item" data-row="' + r._row + '">' +
        '<div class="meta">' +
          '<div class="name">' + esc(r['Institution Name']) + ' <span class="' + (overdue ? 'overdue' : 'due-today') + '">' +
            esc(r['Next Follow-up Date']) + (overdue ? ' (overdue)' : ' (today)') + '</span></div>' +
          '<div class="sub">' + esc(stagePillText(r['Sales Stage'])) + ' · ' + esc(contact) +
            (r['Mobile No.'] ? ' · ' + esc(r['Mobile No.']) : '') + '</div>' +
        '</div>' +
        '<div class="row-actions">' +
          '<button class="ghost small" data-edit="' + r._row + '">Edit</button>' +
          '<button class="pill small" data-email="' + r._row + '"' + (canEmail ? '' : ' disabled title="No email on file"') + '>Email</button>' +
        '</div>' +
      '</div>';
    }).join('');

    root.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var row = findRow(btn.getAttribute('data-edit'));
        if (row) openFollowupDateModal(row);
      });
    });
    root.querySelectorAll('[data-email]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var row = findRow(btn.getAttribute('data-email'));
        if (row) openComposeModal(row);
      });
    });
  }

  function stagePillText(s) { return s || '—'; }

  function findRow(rowNumber) {
    return state.rows.filter(function (r) { return String(r._row) === String(rowNumber); })[0];
  }

  // ---------- follow-up quick-edit modal ----------
  // The Follow-ups tab's "Edit" button only needs to reschedule the next
  // follow-up date — opening the full ~25-field deal form for that is more
  // than the task calls for, so this is a small dedicated modal instead.

  function openFollowupDateModal(row) {
    var html =
      '<div class="modal-backdrop" id="followupModal"><div class="modal" style="max-width:420px">' +
        '<h2>' + esc(row['Institution Name'] || '') + '</h2>' +
        '<form id="followupForm"><div class="form-grid">' +
          textField('Next Follow-up Date', 'Next Follow-up Date (D/M/YYYY)', row['Next Follow-up Date'], { full: true }) +
        '</div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="ghost" id="followupCancel">Cancel</button>' +
          '<button type="submit" class="pill">Save</button>' +
        '</div></form>' +
      '</div></div>';

    document.getElementById('modalRoot').innerHTML = html;
    document.getElementById('followupCancel').addEventListener('click', closeModal);
    document.getElementById('followupModal').addEventListener('click', function (e) { if (e.target.id === 'followupModal') closeModal(); });
    document.getElementById('followupForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var data = new FormData(e.target);
      var out = {};
      data.forEach(function (v, k) { out[k] = v; });
      saveRow(row._row, out, closeModal);
    });
  }

  // ---------- deal edit / new modal ----------

  function textField(key, label, value, opts) {
    opts = opts || {};
    var input;
    if (opts.textarea) {
      input = '<textarea name="' + key + '" autocomplete="off">' + esc(value) + '</textarea>';
    } else if (opts.datalistOptions) {
      var listId = 'dl-' + key.replace(/[^a-z0-9]/gi, '');
      input = '<input type="text" name="' + key + '" list="' + listId + '" autocomplete="off" value="' + esc(value) + '" />' +
        '<datalist id="' + listId + '">' + opts.datalistOptions.map(function (o) { return '<option value="' + esc(o) + '">'; }).join('') + '</datalist>';
    } else {
      input = '<input type="' + (opts.type || 'text') + '" name="' + key + '" autocomplete="off" value="' + esc(value) + '" />';
    }
    return '<div class="field' + (opts.full ? ' full' : '') + '"><label>' + esc(label) + '</label>' + input + '</div>';
  }

  // Per-field config shared by the New Deal wizard (buildField below) — the
  // existing flat edit form in openDealModal keeps its own inline field
  // list untouched, since this only needs to cover the New Deal case.
  var DEAL_FIELD_DEFS = {
    'Month': { label: 'Month', datalist: true },
    'Institution Name': { label: 'Institution Name', full: true },
    'City': { label: 'City' },
    'Institution Type': { label: 'Institution Type', datalist: true },
    'Student Strength': { label: 'Student Strength' },
    'Priority': { label: 'Priority', datalist: true },
    'Sales Stage': { label: 'Sales Stage', datalist: true },
    'Expected Deal Value (₹)': { label: 'Expected Deal Value (₹)', type: 'number' },
    'Expected Closure': { label: 'Expected Closure', datalist: true },
    'Probability (%)': { label: 'Probability (%)', datalist: true },
    'Demo Status': { label: 'Demo Status', datalist: true },
    'Proposal Status': { label: 'Proposal Status', datalist: true },
    'Price Discussion': { label: 'Price Discussion', datalist: true },
    'Next Follow-up Date': { label: 'Next Follow-up Date (D/M/YYYY)' },
    'Last Interaction Date': { label: 'Last Interaction Date' },
    'First Contact Date': { label: 'First Contact Date' },
    'Decision Maker': { label: 'Decision Maker' },
    'Designation': { label: 'Designation' },
    '2nd Level Contact Person': { label: '2nd Level Contact Person' },
    'Designation (2)': { label: 'Designation (2nd contact)' },
    'Mobile No.': { label: 'Mobile No.' },
    'Email': { label: 'Email' },
    'Current ERP': { label: 'Current ERP', datalist: true },
    'Lead Source': { label: 'Lead Source', datalist: true },
    'Implementation Readiness': { label: 'Implementation Readiness' },
    'Remarks': { label: 'Remarks', textarea: true, full: true }
  };

  function buildField(key, value) {
    var def = DEAL_FIELD_DEFS[key];
    if (!def) return '';
    var opts = {};
    if (def.textarea) opts.textarea = true;
    if (def.datalist) opts.datalistOptions = distinctValues(key);
    if (def.type) opts.type = def.type;
    if (def.full) opts.full = true;
    return textField(key, def.label, value, opts);
  }

  // ---------- new deal wizard ----------
  // The ~25-field form is a lot to scroll through for a brand-new row where
  // every field starts blank — grouped into a few short steps instead,
  // navigated with Back/Next and a slide transition (one <form> the whole
  // time, so FormData on submit picks up every step's fields regardless of
  // which one is currently in view — nothing is lost switching steps).
  var WIZARD_STEPS = [
    { title: 'Institution', fields: ['Month', 'Institution Name', 'City', 'Institution Type', 'Student Strength', 'Priority'] },
    { title: 'Pipeline', fields: ['Sales Stage', 'Expected Deal Value (₹)', 'Expected Closure', 'Probability (%)', 'Next Follow-up Date'] },
    { title: 'Progress', fields: ['Demo Status', 'Proposal Status', 'Price Discussion', 'Implementation Readiness', 'Last Interaction Date', 'First Contact Date'] },
    { title: 'Contacts & Notes', fields: ['Decision Maker', 'Designation', '2nd Level Contact Person', 'Designation (2)', 'Mobile No.', 'Email', 'Current ERP', 'Lead Source', 'Remarks'] }
  ];

  function openNewDealWizard() {
    var has = fieldsPresent();
    function has1(f) { return has.indexOf(f) !== -1; }
    var steps = WIZARD_STEPS.map(function (step) {
      return { title: step.title, fields: step.fields.filter(has1) };
    }).filter(function (step) { return step.fields.length > 0; });

    if (steps.length === 0) { openDealModal(null); return; }

    var stepsHtml = steps.map(function (step) {
      var fieldsHtml = step.fields.map(function (key) { return buildField(key, ''); }).join('');
      return '<div class="wizard-step"><div class="form-grid">' + fieldsHtml + '</div></div>';
    }).join('');

    var dotsHtml = steps.map(function (s, i) { return '<span class="wizard-dot" data-dot="' + i + '"></span>'; }).join('');

    var html =
      '<div class="modal-backdrop" id="wizardModal"><div class="modal wizard-modal">' +
        '<div class="wizard-head">' +
          '<h2 id="wizardTitle"></h2>' +
          '<div class="wizard-dots">' + dotsHtml + '</div>' +
        '</div>' +
        '<form id="wizardForm">' +
          '<div class="wizard-viewport"><div class="wizard-track" id="wizardTrack">' + stepsHtml + '</div></div>' +
          '<div class="modal-actions">' +
            '<button type="button" class="ghost" id="wizardCancel">Cancel</button>' +
            '<div class="spacer"></div>' +
            '<button type="button" class="ghost" id="wizardBack" style="display:none">Back</button>' +
            '<button type="button" class="pill" id="wizardNext">Next</button>' +
            '<button type="submit" class="pill" id="wizardSubmit" style="display:none">Add deal</button>' +
          '</div>' +
        '</form>' +
      '</div></div>';

    document.getElementById('modalRoot').innerHTML = html;

    var current = 0;
    var track = document.getElementById('wizardTrack');
    var titleEl = document.getElementById('wizardTitle');
    var backBtn = document.getElementById('wizardBack');
    var nextBtn = document.getElementById('wizardNext');
    var submitBtn = document.getElementById('wizardSubmit');
    var dots = document.querySelectorAll('.wizard-dot');

    function goTo(i) {
      current = Math.max(0, Math.min(steps.length - 1, i));
      track.style.transform = 'translateX(-' + (current * 100) + '%)';
      titleEl.textContent = 'New deal — ' + steps[current].title + ' (' + (current + 1) + '/' + steps.length + ')';
      backBtn.style.display = current === 0 ? 'none' : '';
      var isLast = current === steps.length - 1;
      nextBtn.style.display = isLast ? 'none' : '';
      submitBtn.style.display = isLast ? '' : 'none';
      dots.forEach(function (d, di) { d.classList.toggle('active', di === current); });
    }

    document.getElementById('wizardCancel').addEventListener('click', closeModal);
    document.getElementById('wizardModal').addEventListener('click', function (e) { if (e.target.id === 'wizardModal') closeModal(); });
    backBtn.addEventListener('click', function () { goTo(current - 1); });
    nextBtn.addEventListener('click', function () { goTo(current + 1); });
    dots.forEach(function (d, di) { d.addEventListener('click', function () { goTo(di); }); });

    // Enter in a text input advances to the next step instead of trying to
    // submit early (a hidden submit button can still fire on Enter in some
    // browsers) — textareas keep Enter as a plain newline.
    document.getElementById('wizardForm').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && document.activeElement.tagName !== 'TEXTAREA' && current < steps.length - 1) {
        e.preventDefault();
        goTo(current + 1);
      }
    });

    document.getElementById('wizardForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var data = new FormData(e.target);
      var out = {};
      data.forEach(function (v, k) { out[k] = v; });
      saveRow(null, out, closeModal);
    });

    goTo(0);
  }

  function openDealModal(row) {
    var isNew = !row;
    var r = row || {};
    var has = fieldsPresent();
    function has1(f) { return has.indexOf(f) !== -1; }

    var fields = '';
    if (has1('Month')) fields += textField('Month', 'Month', r.Month, { datalistOptions: distinctValues('Month') });
    if (has1('Institution Name')) fields += textField('Institution Name', 'Institution Name', r['Institution Name'], { full: !isNew });
    if (has1('City')) fields += textField('City', 'City', r.City);
    if (has1('Institution Type')) fields += textField('Institution Type', 'Institution Type', r['Institution Type'], { datalistOptions: distinctValues('Institution Type') });
    if (has1('Student Strength')) fields += textField('Student Strength', 'Student Strength', r['Student Strength']);
    if (has1('Priority')) fields += textField('Priority', 'Priority', r.Priority, { datalistOptions: distinctValues('Priority') });
    if (has1('Sales Stage')) fields += textField('Sales Stage', 'Sales Stage', r['Sales Stage'], { datalistOptions: distinctValues('Sales Stage') });
    if (has1('Expected Deal Value (₹)')) fields += textField('Expected Deal Value (₹)', 'Expected Deal Value (₹)', r['Expected Deal Value (₹)'], { type: 'number' });
    if (has1('Expected Closure')) fields += textField('Expected Closure', 'Expected Closure', r['Expected Closure'], { datalistOptions: distinctValues('Expected Closure') });
    if (has1('Probability (%)')) fields += textField('Probability (%)', 'Probability (%)', r['Probability (%)'], { datalistOptions: distinctValues('Probability (%)') });
    if (has1('Demo Status')) fields += textField('Demo Status', 'Demo Status', r['Demo Status'], { datalistOptions: distinctValues('Demo Status') });
    if (has1('Proposal Status')) fields += textField('Proposal Status', 'Proposal Status', r['Proposal Status'], { datalistOptions: distinctValues('Proposal Status') });
    if (has1('Price Discussion')) fields += textField('Price Discussion', 'Price Discussion', r['Price Discussion'], { datalistOptions: distinctValues('Price Discussion') });
    if (has1('Next Follow-up Date')) fields += textField('Next Follow-up Date', 'Next Follow-up Date (D/M/YYYY)', r['Next Follow-up Date']);
    if (has1('Last Interaction Date')) fields += textField('Last Interaction Date', 'Last Interaction Date', r['Last Interaction Date']);
    if (has1('First Contact Date')) fields += textField('First Contact Date', 'First Contact Date', r['First Contact Date']);
    if (has1('Decision Maker')) fields += textField('Decision Maker', 'Decision Maker', r['Decision Maker']);
    if (has1('Designation')) fields += textField('Designation', 'Designation', r['Designation']);
    if (has1('2nd Level Contact Person')) fields += textField('2nd Level Contact Person', '2nd Level Contact Person', r['2nd Level Contact Person']);
    if (has1('Designation (2)')) fields += textField('Designation (2)', 'Designation (2nd contact)', r['Designation (2)']);
    if (has1('Mobile No.')) fields += textField('Mobile No.', 'Mobile No.', r['Mobile No.']);
    if (has1('Email')) fields += textField('Email', 'Email', r.Email);
    if (has1('Current ERP')) fields += textField('Current ERP', 'Current ERP', r['Current ERP'], { datalistOptions: distinctValues('Current ERP') });
    if (has1('Lead Source')) fields += textField('Lead Source', 'Lead Source', r['Lead Source'], { datalistOptions: distinctValues('Lead Source') });
    if (has1('Implementation Readiness')) fields += textField('Implementation Readiness', 'Implementation Readiness', r['Implementation Readiness']);
    if (has1('Remarks')) fields += textField('Remarks', 'Remarks', r.Remarks, { textarea: true, full: true });

    var html =
      '<div class="modal-backdrop" id="dealModal"><div class="modal">' +
        '<h2>' + (isNew ? 'New deal' : esc(r['Institution Name'] || 'Edit deal')) + '</h2>' +
        '<form id="dealForm"><div class="form-grid">' + fields + '</div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="ghost" id="dealCancel">Cancel</button>' +
          '<button type="submit" class="pill">' + (isNew ? 'Add deal' : 'Save changes') + '</button>' +
        '</div></form>' +
      '</div></div>';

    document.getElementById('modalRoot').innerHTML = html;
    document.getElementById('dealCancel').addEventListener('click', closeModal);
    document.getElementById('dealModal').addEventListener('click', function (e) { if (e.target.id === 'dealModal') closeModal(); });
    document.getElementById('dealForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var data = new FormData(e.target);
      var out = {};
      data.forEach(function (v, k) { out[k] = v; });
      saveRow(isNew ? null : r._row, out, closeModal);
    });
  }

  function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

  // ---------- email compose modal ----------

  function openComposeModal(row) {
    var to = row.Email || '';
    var contact = row['Decision Maker'] || row['2nd Level Contact Person'] || 'there';
    var subject = 'Following up — ' + (row['Institution Name'] || '');
    var body = 'Hi ' + contact + ',\n\nFollowing up on our conversation regarding ' + (row['Institution Name'] || 'your institution') +
      '. Let us know a good time to connect this week.\n\nBest,\nOkie Dokie Sales Team';

    var html =
      '<div class="modal-backdrop" id="emailModal"><div class="modal">' +
        '<h2>Email ' + esc(row['Institution Name'] || '') + '</h2>' +
        (to ? '' : '<div class="banner error">No email on file for this contact — enter one to send anyway.</div>') +
        '<form id="emailForm"><div class="form-grid">' +
          textField('to', 'To', to, { full: true }) +
          textField('subject', 'Subject', subject, { full: true }) +
          textField('body', 'Message', body, { textarea: true, full: true }) +
        '</div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="ghost" id="emailCancel">Cancel</button>' +
          '<button type="submit" class="pill">Send</button>' +
        '</div></form>' +
      '</div></div>';

    document.getElementById('modalRoot').innerHTML = html;
    document.getElementById('emailCancel').addEventListener('click', closeModal);
    document.getElementById('emailModal').addEventListener('click', function (e) { if (e.target.id === 'emailModal') closeModal(); });
    document.getElementById('emailForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var data = new FormData(e.target);
      var out = { _row: row._row };
      data.forEach(function (v, k) { out[k] = v; });
      sendEmailReq({ to: out.to, subject: out.subject, html: esc(out.body).replace(/\n/g, '<br>'), _row: row._row }, closeModal);
    });
  }

  // ---------- tab switching / render ----------

  function render() {
    if (state.tab === 'overview') renderOverview();
    else if (state.tab === 'deals') renderDeals();
    else if (state.tab === 'followups') renderFollowups();
    else if (state.tab === 'master') {
      if (!masterState.loaded) loadMaster(); else renderMaster();
    }
  }

  document.getElementById('nav').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    state.tab = btn.getAttribute('data-tab');
    document.querySelectorAll('#nav button').forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
    ['overview', 'deals', 'followups', 'master'].forEach(function (t) {
      document.getElementById('tab-' + t).style.display = (t === state.tab) ? '' : 'none';
    });
    document.getElementById('newDealBtn').style.display = (state.tab === 'master') ? 'none' : '';
    render();
  });

  document.getElementById('newDealBtn').addEventListener('click', function () { openNewDealWizard(); });

  // ---------- auth gate ----------

  function showAuthGate(hint) {
    document.getElementById('authGate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('authHint').textContent = hint || '';
  }

  function showApp() {
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('app').style.display = '';

    if (me.name) {
      document.getElementById('whoRow').style.display = 'flex';
      document.getElementById('whoText').textContent = 'Signed in as ' + me.name;
    }

    var nav = document.getElementById('nav');
    var overviewBtn = nav.querySelector('[data-tab="overview"]');
    var dealsBtn = nav.querySelector('[data-tab="deals"]');
    var followupsBtn = nav.querySelector('[data-tab="followups"]');
    var masterBtn = document.getElementById('masterTabBtn');

    overviewBtn.style.display = me.isManager ? '' : 'none';
    dealsBtn.style.display = me.isManager ? '' : 'none';
    followupsBtn.style.display = me.isManager ? '' : 'none';
    masterBtn.style.display = me.isHead ? '' : 'none';
    document.getElementById('newDealBtn').style.display = me.isManager ? '' : 'none';

    // A pure head with no sheet of their own opens straight to Master;
    // everyone else keeps the usual Overview-first default.
    if (!me.isManager && me.isHead) {
      state.tab = 'master';
      nav.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b === masterBtn ? 'true' : 'false'); });
      ['overview', 'deals', 'followups', 'master'].forEach(function (t) {
        document.getElementById('tab-' + t).style.display = (t === 'master') ? '' : 'none';
      });
      document.getElementById('newDealBtn').style.display = 'none';
      loadMaster();
    } else {
      load();
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', function () {
    clearSession();
    location.reload();
  });

  function whoami(basic) {
    return fetch('/api/whoami', { headers: { Authorization: 'Basic ' + basic } })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); });
  }

  function attemptLogin(basic) {
    return whoami(basic).then(function (res) {
      if (!res.ok) throw new Error((res.data && res.data.error) || 'Sign-in failed');
      writeSession(basic);
      me = { name: res.data.name || '', isManager: !!res.data.isManager, isHead: !!res.data.isHead };
      showApp();
    });
  }

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var user = document.getElementById('loginUser').value.trim();
    var pass = document.getElementById('loginPass').value;
    var basic = btoa(user + ':' + pass);
    var btn = document.getElementById('loginSubmit');
    btn.disabled = true;
    showAuthGate('Signing in…');
    attemptLogin(basic).catch(function (err) {
      showAuthGate(err.message);
    }).then(function () {
      btn.disabled = false;
    });
  });

  // Boot: if a session is already stored (sessionStorage survived a
  // reload), re-verify it silently before showing the app; otherwise show
  // the login form straight away.
  var existing = readSession();
  if (existing && existing.basic) {
    showAuthGate('Signing in…');
    attemptLogin(existing.basic).catch(function () {
      clearSession();
      showAuthGate();
    });
  } else {
    showAuthGate();
  }
})();
</script>
